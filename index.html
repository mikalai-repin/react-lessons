<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Сохранённые палитра и тема — до первой отрисовки, чтобы не мелькали значения по умолчанию.
         Тема по умолчанию — тёмная (DEFAULT_THEME в src/app/theme.ts) -->
    <script>
      let settings = {};
      try {
        settings = JSON.parse(localStorage.getItem('react-course:v1') || '{}');
      } catch {
        // localStorage недоступен — значения по умолчанию
      }
      if (settings.palette) document.documentElement.dataset.palette = settings.palette;
      document.documentElement.dataset.theme = settings.theme === 'light' ? 'light' : 'dark';
    </script>
    <!-- Загрузчик до запуска JavaScript: та же разметка, что у Loader в src/app/Loader.tsx.
         React заменит содержимое #root при первой отрисовке -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f7f9;
        color: #5e687e;
        font:
          15px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        --react: #149eca;
      }
      /* Палитры (src/styles.css, src/app/Appearance.tsx): фон и цвет атома загрузчика.
         Без data-palette (по умолчанию) — «React», её светлые цвета — в правиле .boot выше.
         Оба атрибута — на <html>, поэтому без пробела: [data-theme='dark'][data-palette='…'] */
      [data-palette='crimson'] .boot {
        background: #f6f5f9;
        color: #6b6578;
        --react: #c3002f;
      }
      [data-palette='violet'] .boot {
        background: #f7f6fb;
        color: #686379;
        --react: #6d4fc2;
      }
      [data-palette='emerald'] .boot {
        background: #f5f8f6;
        color: #5f6d64;
        --react: #0f7a55;
      }
      [data-theme='dark'] .boot {
        background: #16181d;
        color: #99a1b3;
        --react: #58c4dc;
      }
      [data-theme='dark'][data-palette='crimson'] .boot {
        background: #14121b;
        color: #9c96ab;
        --react: #ff5c7a;
      }
      [data-theme='dark'][data-palette='violet'] .boot {
        background: #15131c;
        color: #9d97b0;
        --react: #a996ff;
      }
      [data-theme='dark'][data-palette='emerald'] .boot {
        background: #121815;
        color: #94a59b;
        --react: #4fd1a1;
      }
      .boot svg {
        animation: boot-spin 12s linear infinite;
      }
      .boot .nucleus {
        fill: var(--react);
        animation: boot-pulse 1.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .boot .orbit {
        fill: none;
        stroke: var(--react);
        stroke-width: 1;
        opacity: 0.55;
      }
      .boot .electron {
        fill: var(--react);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg,
        .boot .nucleus {
          animation: none;
        }
        .boot .electron {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <svg width="64" height="64" viewBox="-12 -12 24 24" aria-hidden="true">
          <circle r="2.05" class="nucleus" />
          <g>
            <path class="orbit" d="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0" />
            <circle r="1.1" class="electron">
              <animateMotion
                dur="1.8s"
                begin="0s"
                repeatCount="indefinite"
                path="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0"
              />
            </circle>
          </g>
          <g transform="rotate(60)">
            <path class="orbit" d="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0" />
            <circle r="1.1" class="electron">
              <animateMotion
                dur="1.8s"
                begin="-0.6s"
                repeatCount="indefinite"
                path="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0"
              />
            </circle>
          </g>
          <g transform="rotate(120)">
            <path class="orbit" d="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0" />
            <circle r="1.1" class="electron">
              <animateMotion
                dur="1.8s"
                begin="-1.2s"
                repeatCount="indefinite"
                path="M 11 0 A 11 4.2 0 1 1 -11 0 A 11 4.2 0 1 1 11 0"
              />
            </circle>
          </g>
        </svg>
        <span>Загружаем курс…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
