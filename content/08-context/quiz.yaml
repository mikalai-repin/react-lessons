# Квиз главы «Контекст». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      `GameGrid` получает `quantityOf` и `onAdd` и сам их не использует — только передаёт карточкам. Как называется такая передача?
    options:
      - Проброс props (prop drilling)
      - Подъём состояния (lifting state up)
      - Композиция через `children`
      - Однонаправленный поток данных
    explanation: |
      Проброс props — данные идут через компоненты, которым они не нужны, только потому, что те стоят на пути (шаг «Проброс props»).
    step: 01-prop-drilling

  - question: |
      Между `App` и `GameGrid` стоит `Section`, но корзину он не получает. Почему?
    options:
      - '`App` создаёт сетку сам и отдаёт разделу готовым элементом в `children`'
      - '`Section` читает корзину из контекста, поэтому props ему не нужны'
      - 'React пропускает компоненты без собственных props при передаче данных'
      - '`Section` получает корзину, но TypeScript скрывает лишние props'
    explanation: |
      Это композиция: промежуточный компонент, который лишь оборачивает содержимое, принимает готовые элементы, а не данные для них (шаг «Проброс props»).
    step: 01-prop-drilling

  - question: |
      Карточку нарисовали в `main.tsx` без провайдера корзины. Что вернёт `useContext(CartContext)`?

      ```tsx
      export const CartContext =
        createContext<CartContextValue | null>(null);
      ```
    options:
      - '`null` — значение по умолчанию из `createContext`'
      - '`undefined` — без провайдера значения нет'
      - 'Ничего: React бросит ошибку «нет провайдера» сам'
      - 'Пустой объект `{}` того же типа'
    explanation: |
      Значение по умолчанию React отдаёт, когда выше по дереву нет ни одного провайдера; проверка на `null` в коде превращает это в понятную ошибку (шаг «createContext»).
    step: 02-create-context

  - question: |
      В `App` написали `<CartContext>` без `value`, проверка в карточке — `if (cart === null) throw …`. Что произойдёт при запуске?
    options:
      - "Предупреждение про `value`, затем `TypeError … (reading 'items')`: провайдер дал `undefined`, а не `null`"
      - 'Карточка бросит «нет провайдера»: без `value` React берёт значение по умолчанию'
      - 'Ничего: значение провайдера без `value` — пустой объект, корзина пуста'
      - 'Сборка не пройдёт: `value` обязателен, превью код не запустит'
    explanation: |
      Значение по умолчанию используется только без провайдера. Провайдер без `value` предоставляет `undefined`, проверка `=== null` его пропускает (шаг «createContext»). Ошибка типов TS2741 запуск не останавливает.
    step: 02-create-context

  - question: |
      Почему для корзины значение по умолчанию — `null`, а не объект-заглушка с пустыми функциями?
    options:
      - 'Заглушка прячет забытый провайдер: кнопка «В корзину» молча ничего не делает'
      - 'Объект нельзя передать в `createContext` — только примитивы'
      - 'С объектом по умолчанию React рендерит потребителей при каждом действии'
      - 'Заглушка работает только со `useContext`, а `use` требует `null`'
    explanation: |
      С заглушкой карточка вне провайдера рисуется без ошибок, а «В корзину» ничего не делает. `null` и проверка дают ошибку с понятным текстом (шаг «createContext»).
    step: 02-create-context

  - question: |
      Чем `use(CartContext)` отличается от `useContext(CartContext)`?
    options:
      - '`use` можно вызывать в условиях и циклах, `useContext` — только на верхнем уровне'
      - '`use` читает значение по умолчанию, `useContext` — значение провайдера'
      - '`use` подписывает компонент на часть значения, `useContext` — на всё'
      - '`use` можно вызывать в обработчиках событий, `useContext` — только при рендере'
    explanation: |
      Значение у обоих одно и то же — ближайшего провайдера. Разница в правилах вызова; в обработчике нельзя ни тот, ни другой: контекст читается во время рендера (шаг «use и useContext»).
    step: 03-use-context

  - question: |
      В подвале после подписки читают корзину внутри `if (result !== null)` через `useContext`. Что покажет консоль после подписки?
    options:
      - 'Таблицу «change in the order of Hooks» со строкой `undefined → useContext`, но значение прочитано верно'
      - 'Ничего: `useContext` не занимает ячейку, и React не следит за его порядком'
      - 'Ошибку «Rendered more hooks than during the previous render.», подвал пропадёт'
      - 'Ошибку «Invalid hook call», потому что хук вызван в блоке `if`'
    explanation: |
      Ячейки у `useContext` нет, ломать нечего, но в режиме разработки React сверяет порядок имён хуков, а `useContext` в этом списке есть. С `use` консоль пуста (шаг «use и useContext»).
    step: 03-use-context

  - question: |
      `useCart()` внутри вызывает `use`. Что скажет линтер на `if (ok) { useCart(); }`?
    options:
      - '«React Hook "useCart" is called conditionally…» — он судит по имени `use…`'
      - 'Ничего: внутри `use`, а его можно вызывать в условиях'
      - 'Предупреждение `exhaustive-deps`: у хука нет массива зависимостей'
      - 'Ошибку компилятора: свой хук не может вызывать `use`'
    explanation: |
      Функция с именем `use…` для линтера — хук, и её вызов в условии запрещён: внутри могли бы оказаться `useState` или `useEffect` (шаг «use и useContext»).
    step: 03-use-context

  - question: |
      Состояние корзины переехало из `App` в `CartProvider`, а `App` оборачивает разметку в `<CartProvider>`. Что рендерится после «В корзину»?
    options:
      - '`CartProvider` и потребители корзины; `App` — нет'
      - '`App` и всё дерево, как в главе 4'
      - 'Только `CartProvider`: потребители обновятся без рендера'
      - '`App` и `CartProvider`, но не карточки'
    explanation: |
      Состояние рендерит компонент, которому принадлежит, а не родителя. Элементы в `children` созданы `App` и не изменились — React их пропускает, кроме тех, кто читает контекст (шаги «Контекст и редьюсер» и «Цена контекста»).
    step: 04-context-reducer

  - question: |
      Мини-корзину обернули вторым `<CartProvider>`. Покупатель нажал «В корзину» на карточке. Что покажет мини-корзина?
    options:
      - '«Корзина пуста»: у внутреннего провайдера своё состояние, а мини-корзина читает ближайший'
      - 'Ту же позицию, что шапка: все провайдеры одного контекста делят состояние'
      - 'Ошибку: два провайдера одного контекста в дереве запрещены'
      - 'Позицию дважды: значения двух провайдеров складываются'
    explanation: |
      Провайдер — место, где корзина создаётся. Сколько провайдеров — столько корзин; потребитель видит значение ближайшего (шаг «Контекст и редьюсер»).
    step: 04-context-reducer

  - question: |
      Значение провайдера собирается при каждом рендере: `const value = { items, add, … }`. Корзина не менялась, но провайдер отрендерился — погасло уведомление. Что с потребителями?
    options:
      - 'Рендерятся все: новый объект — другая ссылка, `Object.is` говорит «изменилось»'
      - 'Не рендерятся: React сравнивает значение по полям'
      - 'Рендерятся только те, кто читает `items`'
      - 'Не рендерятся: потребители обновляются только по `dispatch`'
    explanation: |
      React сравнивает `value` со старым через `Object.is`. Без `useMemo` после погасшего уведомления — шапка, мини-корзина и 12 строк карточек (шаг «Цена контекста»).
    step: 05-context-cost

  - question: |
      Действия собраны в `useMemo(() => ({ add, … }), [dispatch, showToast])`, а `showToast` — обычная функция в теле провайдера. Что не так?
    options:
      - '`showToast` новая при каждом рендере — `useMemo` каждый раз создаёт новый объект'
      - 'Ничего: `useMemo` сравнивает функции по исходному коду'
      - '`dispatch` нестабилен, его нельзя класть в зависимости'
      - '`useMemo` нельзя использовать в компоненте-провайдере'
    explanation: |
      Зависимость меняется на каждом рендере, и мемоизация бесполезна; линтер предлагает перенести функцию внутрь `useMemo` или обернуть в `useCallback` (шаг «Цена контекста»).
    step: 05-context-cost

  - question: |
      Что из этого лучше всего подходит для контекста?
    options:
      - 'Тема оформления: нужна многим, меняется редко'
      - 'Текст поля поиска: меняется на каждую букву'
      - 'Ответы сервера: каталог игр со страницами'
      - 'Открыто ли окно в одном компоненте'
    explanation: |
      При каждом новом значении рендерятся все потребители. Часто меняющееся — во внешнее хранилище, данные сервера — в кэш запросов, локальное — в состояние (шаг «Когда нужен контекст»).
    step: 06-when-context

  - question: |
      `ThemeProvider` стоит в `main.tsx` выше `App`, значение собирается без `useMemo`. Покупатель набирает букву в поиске. Рендерится ли `ThemeProvider`?
    options:
      - 'Нет: состояние поиска в `App`, а провайдер выше и рендерится только при смене темы'
      - 'Да: новый объект `value` при каждом рендере `App`'
      - 'Да: провайдер рендерится при любом рендере своих детей'
      - 'Нет, но шапка рендерится заново из-за новой темы'
    explanation: |
      Лог показал: при вводе `render ThemeProvider` нет ни одного, при переключении темы — только провайдер и шапка. Поэтому `useMemo` ему не нужен (шаг «Когда нужен контекст»).
    step: 06-when-context

  - question: |
      Как `use(CartContext)` находит значение ближайшего провайдера?
    options:
      - 'Читает поле `_currentValue` объекта контекста: провайдер положил туда значение на входе в поддерево'
      - 'Поднимается по `return` файберов, пока не встретит провайдер этого контекста'
      - 'Берёт ячейку хука, которую провайдер создал в компоненте-потребителе'
      - 'Ищет провайдер в карте контекстов корня по имени переменной'
    explanation: |
      `pushProvider` на входе кладёт значение в контекст, старое — в стек; `popProvider` на выходе возвращает старое. Поиска нет — поэтому и ячейки хука нет (шаг «Под капотом»).
    step: 07-under-the-hood
