# Квиз главы «Состояние и события». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В карточке объявлена переменная, и обработчик кнопки её увеличивает. Почему на экране всё время «В корзине: 0 шт.»?

      ```tsx
      let quantity = 0;
      function handleAddClick() {
        quantity += 1;
      }
      ```
    options:
      - 'React не следит за переменными и не рендерит заново, а при новом рендере `let quantity = 0` снова дал бы 0'
      - 'Переменную нужно объявить через `var`: `let` внутри компонента React делает неизменяемой'
      - 'React перерисовал карточку, но обработчик изменил копию переменной из прошлого рендера'
      - 'Обработчик не вызывается: `onClick` у своего компонента `Button` React игнорирует'
    explanation: |
      Обработчик работает (в консоли 1, 2, 3), но изменение обычной переменной не запускает рендер. А локальная переменная рождается заново при каждом вызове компонента, поэтому даже новый рендер показал бы 0 (шаг «Проблема: обычная переменная»).
    step: 01-problem

  - question: |
      Состояние `quantity` объявлено в `GameCard` через `useState`. Покупатель нажал «В корзину» у одной карточки. Какие компоненты React вызовет заново?
    options:
      - 'Только эту карточку — ту, чьё состояние изменилось'
      - '`App` и все карточки: изменение состояния перерисовывает всё приложение'
      - 'Все карточки той же игры на странице, в обоих разделах'
      - 'Никаких: React меняет текст в DOM напрямую, без рендера'
    explanation: |
      Лог `console.log('render', game.title, quantity)` после щелчка показывает две строки одной карточки (две — из-за строгого режима). `App` и остальные карточки React не вызывал. У второго «Острова» своё состояние, и оно осталось 0 (шаг «useState»).
    step: 02-use-state

  - question: |
      Где можно вызывать `useState`?
    options:
      - 'Только на верхнем уровне тела компонента или своего хука — не в условиях, циклах и обработчиках'
      - 'Где угодно внутри компонента, в том числе в обработчиках событий и внутри `if`'
      - 'В любой функции модуля, если её имя начинается с `use` или `handle`'
      - 'Только в корневом компоненте `App`, остальные получают состояние через props'
    explanation: |
      React различает состояния по порядку вызова хуков, поэтому порядок не должен меняться. Вызов `useState` в обработчике — ошибка `Invalid hook call. Hooks can only be called inside of the body of a function component.` (шаг «useState»).
    step: 02-use-state

  - question: |
      Что произойдёт с такой кнопкой, если `handleAddClick` вызывает `setQuantity`?

      ```tsx
      <Button onClick={handleAddClick()}>В корзину</Button>
      ```
    options:
      - 'Функция вызовется при рендере, сеттер запросит новый рендер — React остановит цикл ошибкой «Too many re-renders»'
      - 'Ничего особенного: React вызовет `handleAddClick` при щелчке, скобки он отбрасывает сам'
      - 'Обработчик сработает один раз при запуске, а щелчки по кнопке будут игнорироваться без ошибок'
      - 'TypeScript промолчит, а React выведет предупреждение и подставит функцию вместо результата'
    explanation: |
      Со скобками функция вызывается во время рендера, а в `onClick` попадает её результат. Редактор подчеркнёт: `Type 'void' is not assignable to type 'MouseEventHandler…'`. В превью рендер вызывает сеттер, сеттер — рендер, и React бросает `Too many re-renders` — приложение падает (шаг «События»).
    step: 03-events

  - question: |
      Форма подписки с `onSubmit`, в котором нет `e.preventDefault()`. Что увидит ученик в превью после отправки?
    options:
      - 'Приложение запустится заново с адресом `/?email=…`: корзина обнулится, консоль очистится'
      - 'Ничего: React сам отменяет отправку формы, если у неё есть `onSubmit`'
      - 'Строку из обработчика в консоли и ошибку React о том, что форма отправлена без `action`'
      - 'Корзина сохранится, а адрес не изменится: браузер отправит форму в фоне'
    explanation: |
      Отправка формы — действие браузера по умолчанию: страница загружается заново с полями формы в адресе. Приложение стартует с нуля, состояние пропадает. `e.preventDefault()` первой строкой обработчика это отменяет (шаг «События»).
    step: 03-events

  - question: |
      Что выведет `console.log` и что будет на экране после одного щелчка, если `quantity` было 0?

      ```tsx
      function handleAddClick() {
        setQuantity(quantity + 1);
        setQuantity(quantity + 1);
        setQuantity(quantity + 1);
        console.log(quantity);
      }
      ```
    options:
      - 'В консоли 0, на экране 1'
      - 'В консоли 3, на экране 3'
      - 'В консоли 0, на экране 3'
      - 'В консоли 1, на экране 1'
    explanation: |
      Состояние — снимок: в этом рендере `quantity` — константа 0. Три вызова просят «в следующем рендере — 0 + 1», и сеттер переменную не меняет (шаг «Состояние — снимок»).
    step: 04-snapshot

  - question: |
      Обработчик запоминает значение и выводит его через 3 секунды. Покупатель быстро нажал кнопку три раза. Что появится в консоли?

      ```tsx
      function handleAddClick() {
        setQuantity(quantity + 1);
        setTimeout(() => console.log(quantity), 3000);
      }
      ```
    options:
      - '0, 1, 2 — каждый обработчик помнит значение своего рендера'
      - '3, 3, 3 — через 3 секунды состояние уже обновилось'
      - '1, 2, 3 — каждый обработчик видит значение после своего сеттера'
      - '0, 0, 0 — таймеры видят только начальное значение `useState`'
    explanation: |
      Каждый щелчок обработал `handleAddClick` из того рендера, что был на экране в момент щелчка, а замыкание помнит константу этого рендера. На экране при этом уже 3 (шаг «Состояние — снимок»).
    step: 04-snapshot

  - question: |
      `quantity` равно 0. Чему оно будет равно после щелчка?

      ```tsx
      function handleAddClick() {
        setQuantity(quantity + 5);
        setQuantity((q) => q + 1);
      }
      ```
    options:
      - '6'
      - '5'
      - '1'
      - '7'
    explanation: |
      Обновления встают в очередь и разбираются по порядку: значение заменяет текущее (5), функция обновления получает результат предыдущего (5 + 1) (шаг «Очередь обновлений»).
    step: 05-queue

  - question: |
      В обработчике три вызова сеттера подряд, а затем ещё два — внутри `setTimeout`. Сколько рендеров сделает React (без учёта строгого режима)?
    options:
      - 'Два: один после обработчика, один после колбэка таймера'
      - 'Пять: каждый вызов сеттера запускает отдельный рендер'
      - 'Четыре: три после обработчика и один после таймера'
      - 'Три: в обработчике один, в таймере — по рендеру на вызов'
    explanation: |
      React собирает обновления и рендерит один раз, когда код закончился, — это пакетная обработка. С React 18 она работает везде: в обработчиках, таймерах и после `await` (шаг «Очередь обновлений»).
    step: 05-queue

  - question: |
      Число штук в корзине нужно и `Header`, и всем `GameCard`. Где хранить это состояние?
    options:
      - 'В `App` — ближайшем общем родителе; вниз передать значение и обработчик `onAdd`'
      - 'В каждой `GameCard`, а `Header` прочитает его через props карточек'
      - 'В `Header`, а карточки изменят его через импорт функции из файла шапки'
      - 'В переменной модуля `cart.ts`, которую импортируют все компоненты'
    explanation: |
      Данные текут только сверху вниз, поэтому общее состояние поднимают к ближайшему общему родителю. Значение уходит вниз в props, событие поднимается вверх через проп-функцию — у числа один источник истины (шаг «Подъём состояния»).
    step: 06-lifting

  - question: |
      Почему после этого обработчика экран не обновляется, хотя в консоли длина массива растёт?

      ```tsx
      cart.push({ gameId, quantity: 1 });
      setCart(cart);
      ```
    options:
      - 'React сравнил старое и новое значение через `Object.is` — это тот же массив, рендер не нужен'
      - '`push` запрещён в React: массив состояния заморожен, и изменение отброшено'
      - 'Сеттер массива принимает только функцию обновления, значение он игнорирует'
      - 'React обновит экран позже, при следующем рендере по таймеру'
    explanation: |
      `push` изменил тот же объект, и `setCart` получил ту же ссылку. Для React ничего не изменилось. Мутация при этом осталась в массиве и всплывёт при следующем правильном обновлении (шаг «Объекты и массивы»).
    step: 07-arrays

  - question: |
      Функция обновления меняет объект позиции «на месте» и возвращает новый массив. Покупатель нажал «В корзину» у новой игры три раза. Что покажет карточка в строгом режиме?

      ```tsx
      setCart((items) => {
        const item = items.find((i) => i.gameId === gameId);
        if (!item) return [...items, { gameId, quantity: 1 }];
        item.quantity += 1;
        return [...items];
      });
      ```
    options:
      - '«В корзине: 5 шт.» — строгий режим вызывает функцию обновления дважды, и мутация срабатывает два раза'
      - '«В корзине: 3 шт.» — массив новый, поэтому мутация объекта ничему не мешает'
      - '«В корзине: 1 шт.» — React не видит изменений внутри объектов и не рендерит'
      - '«В корзине: 6 шт.» — строгий режим удваивает каждое обновление, включая первое'
    explanation: |
      Первый щелчок создаёт позицию с 1. Дальше каждый щелчок прибавляет по 2: второй вызов функции обновления получает уже изменённый объект. Без строгого режима было бы 3 — ошибка спряталась бы до продакшена (шаг «Объекты и массивы»).
    step: 07-arrays

  - question: |
      Корзина хранится в `App`. После щелчка «В корзину» React вызвал `App`, `Header` и все девять карточек. Что произошло с DOM?
    options:
      - 'Изменились только отличия: число в шапке и строки «В корзине» у двух карточек этой игры'
      - 'React заменил разметку всех девяти карточек, потому что вызвал каждую из них'
      - 'React заменил содержимое `#root` целиком новой разметкой из рендера'
      - 'DOM не изменился: React обновляет его только при следующем щелчке'
    explanation: |
      Рендер — это вызовы компонентов и сверка элементов, а в фазе фиксации React вносит в DOM только найденные отличия. `MutationObserver` показал три изменения на первый щелчок (шаг «Под капотом: рендер и фиксация»).
    step: 08-render-commit

  - question: |
      Что сделает React после вызова `setCart((items) => items)`?
    options:
      - 'Не станет рендерить: новое значение совпало со старым по `Object.is`'
      - 'Отрендерит `App` и всех детей, но не изменит DOM'
      - 'Выведет предупреждение, что функция обновления ничего не изменила'
      - 'Отрендерит только `App`, а детей пропустит'
    explanation: |
      Функция вернула тот же массив, и React не стал рендерить — в логе нет ни одного `render App`. Документация оговаривает, что иногда React всё же вызывает компонент один раз перед отказом, но в эксперименте вызовов не было (шаг «Под капотом: рендер и фиксация»).
    step: 08-render-commit
