# Квиз главы «Данные с сервера». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Сервер ответил на `fetch('/api/games/999')` кодом 404. Что произойдёт с промисом `fetch`?
    options:
      - 'Выполнится успешно: `response.ok` будет `false`, и ошибку нужно бросить самим'
      - 'Отклонится с ошибкой 404 — её поймает ближайший `catch`'
      - 'Отклонится с `AbortError`, потому что ответ пустой'
      - 'Не выполнится и не отклонится, пока не придёт ответ 200'
    explanation: |
      `fetch` отклоняется, только если ответа нет совсем: нет сети или запрос отменили. Поэтому проверка `response.ok` и своя `ApiError` живут в одном месте — в `apiGet` (шаг «Учебный бэкенд»).
    step: 01-backend

  - question: |
      В эффекте каталога убрали очистку `return () => controller.abort()`. Сервер отвечает на «Семейные» медленнее, чем на «Детские». Покупатель выбрал «Семейные» и сразу «Детские». Что окажется на экране?
    options:
      - 'Сначала детские игры, а потом их заменят семейные — хотя выбраны «Детские»'
      - 'Детские игры: React сам отбросит ответ на устаревший запрос'
      - 'Семейные, и запрос детских во «Сети» будет отменён'
      - 'Ошибка в консоли: два запроса одного эффекта одновременно запрещены'
    explanation: |
      Это гонка: побеждает последний пришедший ответ, а не последний заданный вопрос. Очистка с `abort()` отменяет устаревший запрос (шаг «fetch в эффекте»).
    step: 02-fetch-effect

  - question: |
      Что произойдёт, если `Reviews` будет сам создавать промис?

      ```tsx
      export function Reviews({ gameId }: ReviewsProps) {
        const list = use(fetchReviews(gameId));
        …
      }
      ```
    options:
      - 'Запросы пойдут один за другим без конца, а вместо отзывов останется заглушка'
      - 'Один запрос, отзывы появятся как обычно'
      - 'Ошибка TypeScript: `use` не принимает вызов функции'
      - 'React выведет ошибку в консоль и покажет отзывы без `Suspense`'
    explanation: |
      Каждый рендер создаёт новый промис, который снова в пути, и компонент снова приостанавливается. Консоль при этом молчит. Промис для `use` создают вне рендера — в загрузчике или в кэше библиотеки (шаг «Suspense и use»).
    step: 03-suspense

  - question: |
      В загрузчике поменяли местами две строки: сначала `const game = await fetchGame(…)`, потом `const reviews = fetchReviews(…)`. Что изменится при задержке сервера 1000 мс?
    options:
      - 'Отзывы появятся примерно через две секунды вместо одной: их запрос стартует после ответа на игру'
      - 'Ничего: роутер всё равно запускает запросы параллельно'
      - 'Переход на страницу будет ждать и отзывы'
      - 'Отзывы перестанут показываться: промис создан после `await`'
    explanation: |
      Это водопад: второй запрос ждёт первый. Запрос отзывов нужно запустить до `await` (шаг «Suspense и use»).
    step: 03-suspense

  - question: |
      Почему граница ошибок в React 19 — по-прежнему классовый компонент?
    options:
      - 'Перехватить ошибку рендера потомков умеют только методы класса `getDerivedStateFromError` и `componentDidCatch` — хука для этого нет'
      - 'Функциональные компоненты не могут рендерить запасную разметку'
      - 'Так требует `react-error-boundary`; встроенная граница — функция'
      - 'Классы рендерятся раньше функций и успевают поймать ошибку'
    explanation: |
      Это единственное место, где в современном React нужен класс. `react-error-boundary` — готовый такой класс с повтором и `resetKeys` (шаг «Границы ошибок»).
    step: 04-error-boundaries

  - question: |
      У границы отзывов убрали `resetKeys={[reviews]}`. Отзывы «Драконьей почты» упали, покупатель нажал «Следующая игра →». Что в блоке отзывов следующей игры?
    options:
      - '«Не удалось загрузить отзывы.» — хотя её отзывы в порядке'
      - 'Её отзывы: новая страница — новая граница'
      - 'Скелет загрузки, который не исчезнет'
      - 'Отзывы «Драконьей почты»'
    explanation: |
      Тот же маршрут — тот же `GamePage` и та же граница; её состояние ошибки пережило переход. `resetKeys` сбрасывает ошибку при смене промиса (шаг «Границы ошибок»).
    step: 04-error-boundaries

  - question: |
      Чем `isPending` отличается от `isFetching` у результата `useQuery`?
    options:
      - '`isPending` — данных ещё нет; `isFetching` — запрос в полёте, в том числе фоновый при уже показанных данных'
      - 'Это синонимы: оба `true`, пока идёт запрос'
      - '`isPending` — запрос в полёте; `isFetching` — данные пришли и обрабатываются'
      - '`isPending` — только у мутаций, `isFetching` — только у запросов'
    explanation: |
      Это разные вопросы: «есть ли что показать?» и «идёт ли сейчас запрос?». `isLoading` — их сочетание (шаг «TanStack Query»).
    step: 05-tanstack-query

  - question: |
      Шапка и каталог одновременно вызывают `useQuery` с одним и тем же ключом. Сколько удачных запросов уйдёт на сервер?
    options:
      - 'Один: одна запись кэша на ключ, ответ получат оба компонента'
      - 'Два: у каждого компонента свой запрос'
      - 'Два, но второй Query отменит'
      - 'Ни одного, пока один компонент не размонтируется'
    explanation: |
      Это дедупликация: запрос в полёте у записи один (шаг «TanStack Query»; в «Сети» ещё будет отменённый — от StrictMode).
    step: 05-tanstack-query

  - question: |
      Включили «Ошибка 500» и перезапустили каталог на `useQuery` с настройками по умолчанию. Что увидит покупатель?
    options:
      - 'Около восьми секунд «Загружаем каталог…» и четыре ответа 500 во «Сети», потом сообщение об ошибке'
      - 'Сообщение об ошибке сразу после первого ответа 500'
      - '«Загружаем каталог…» навсегда: Query повторяет без конца'
      - 'Пустой каталог без сообщений'
    explanation: |
      По умолчанию в браузере `retry: 3` с паузами 1, 2 и 4 с (шаг «TanStack Query»).
    step: 05-tanstack-query

  - question: |
      Что произойдёт при смене категории, если ключ каталога не содержит параметров фильтров?

      ```tsx
      queryKey: ['games', 'list'],
      queryFn: ({ signal }) => fetchGames(params, signal),
      ```
    options:
      - 'Адрес изменится, а список — нет: ключ тот же, нового запроса не будет'
      - 'Query заметит новые `params` в замыкании и запросит снова'
      - 'TypeScript сообщит, что `params` нет в ключе'
      - 'Список очистится и покажет «Ничего не нашлось»'
    explanation: |
      Для Query запрос определяется ключом; всё, от чего зависит ответ, должно быть в ключе (шаг «Ключи и кэш»).
    step: 06-cache

  - question: |
      Чем `staleTime` отличается от `gcTime`?
    options:
      - '`staleTime` — сколько данные свежие и берутся без запроса; `gcTime` — когда удалить запись, которую никто не показывает'
      - '`staleTime` — сколько ждать ответа сервера; `gcTime` — сколько ждать перед повтором'
      - '`staleTime` — когда удалить запись; `gcTime` — когда её перезапросить'
      - 'Это одно и то же: `gcTime` — новое имя `staleTime`'
    explanation: |
      Устаревшие данные Query показывает, но перезапрашивает; удаляются только записи без наблюдателей — через 5 минут по умолчанию (шаг «Ключи и кэш»).
    step: 06-cache

  - question: |
      Загрузчик запускает `queryClient.query(reviewsQuery(id)).catch(noop)`, а отзывы на сервере отвечают 500. Когда страница покажет «Не удалось загрузить отзывы»?
    options:
      - 'Сразу после первого ответа: у `queryClient.query` по умолчанию `retry: false`'
      - 'Через восемь секунд, после трёх повторов'
      - 'Никогда: `noop` проглотил ошибку'
      - 'Только после перезагрузки страницы'
    explanation: |
      Снаружи компонентов некому дождаться повтора, поэтому у `query` повторов нет. Ошибка лежит в кэше, `useSuspenseQuery` находит её и передаёт границе (шаг «Query и роутер»).
    step: 07-query-router

  - question: |
      В `useMutation` колбэк `onSuccess` возвращает промис `queryClient.invalidateQueries(…)`. Что это меняет?
    options:
      - 'Мутация остаётся `isPending`, пока перезапрос списка не закончится'
      - 'Ничего: результат `onSuccess` игнорируется'
      - 'Инвалидация выполнится до запроса мутации'
      - 'Мутация повторится, если перезапрос не удался'
    explanation: |
      Возвращённый промис мутация дожидается — кнопка «Отправляем…» до появления отзыва в списке. Без `return` мутация заканчивается раньше (шаг «Изменения на сервере»).
    step: 08-mutations

  - question: |
      Зачем в `onMutate` оптимистичного обновления первым делом вызывают `queryClient.cancelQueries({ queryKey })`?
    options:
      - 'Ответ идущего запроса списка пришёл бы позже и затёр оптимистичную запись'
      - 'Чтобы мутация не отправилась дважды'
      - 'Без отмены `setQueryData` бросит ошибку'
      - 'Чтобы освободить место в кэше под новую запись'
    explanation: |
      Схема — отменить, снять снимок, записать, откатить при ошибке, сверить с сервером (шаг «Оптимистичное обновление»).
    step: 09-optimistic

  - question: |
      Порционному каталогу (`useInfiniteQuery`) дали тот же ключ, что у шапки (`useQuery` со списком игр). Что произойдёт?
    options:
      - 'Шапка покажет «в каталоге undefined игр»: одна запись, а форма данных у хуков разная'
      - 'TypeScript сообщит о несовместимых типах данных'
      - 'Query создаст две записи: у хуков разные кэши'
      - 'Ничего: `useInfiniteQuery` сам добавляет к ключу суффикс'
    explanation: |
      Шапка ждёт `{ items, total }`, а порционный запрос кладёт `{ pages, pageParams }`. Ни типы, ни консоль не возражают — правило «один ключ — одна форма данных» держится на фабрике ключей (шаг «Бесконечный список»).
    step: 10-infinite
