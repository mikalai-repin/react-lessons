# Квиз главы «JSX и разметка». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Почему код `<p>{if (game.price > 0) formatPrice(game.price)}</p>` не собирается?
    options:
      - 'В скобках допустимо только выражение: их содержимое становится аргументом функции, а `if` — инструкция'
      - 'Внутри JSX нельзя вызывать функции: результат `formatPrice` нужно сначала сохранить в переменную'
      - '`if` в JSX работает только вместе с `else`, иначе компилятор не знает, что рисовать в другом случае'
      - 'Условия разрешены только в атрибутах, а в тексте элемента допустимы лишь переменные и поля'
    explanation: |
      JSX — это вызов `jsxDEV(…)`, и то, что в фигурных скобках, становится его аргументом. Передать в аргумент можно выражение (переменную, вызов функции, тернарный оператор), но не инструкцию `if`. Всё, что нужно подготовить, готовят до `return` (шаг «Выражения в JSX»).
    step: 01-expressions

  - question: |
      Что окажется на экране?

      ```tsx
      <p>[{0}][{null}][{true}][{NaN}][{[1, 2, 3]}]</p>
      ```
    options:
      - '`[0][][][NaN][123]`'
      - '`[][][][][123]`'
      - '`[0][null][true][NaN][1,2,3]`'
      - '`[0][][true][NaN][1,2,3]`'
    explanation: |
      Строки и числа React рисует как есть — включая `0` и `NaN`; `null`, `undefined`, `true` и `false` не рисует ничего; массив рисует элемент за элементом, без запятых (шаг «Выражения в JSX»).
    step: 01-expressions

  - question: |
      Что произойдёт, если в React-коде написать `<p class="muted">…</p>` вместо `className`?
    options:
      - 'Класс применится — React передаст атрибут в DOM, — но в консоли будет ошибка `Invalid DOM property`'
      - 'Код не соберётся: `class` — ключевое слово JavaScript, и компилятор JSX его не пропустит'
      - 'React молча отбросит неизвестный атрибут, и подпись останется без класса и без сообщений'
      - 'React сам переименует `class` в `className`, и всё сработает без ошибок и предупреждений'
    explanation: |
      Неизвестные атрибуты React по умолчанию передаёт в DOM как есть, поэтому стиль применится. Но TypeScript подчеркнёт `class`, а в консоли будет ``Invalid DOM property `class`. Did you mean `className`?`` — в React-коде `class` считается ошибкой, даже если работает (шаг «Атрибуты»).
    step: 02-attributes

  - question: |
      Какой атрибут `style` окажется в DOM?

      ```tsx
      <div style={{ marginTop: 4, opacity: 0.9 }} />
      ```
    options:
      - '`margin-top: 4px; opacity: 0.9;`'
      - '`margin-top: 4; opacity: 0.9;` — без единиц'
      - '`margin-top: 4px; opacity: 0.9px;`'
      - 'Никакой: `style` в JSX ждёт строку CSS, как в HTML'
    explanation: |
      В JSX `style` — объект со свойствами в camelCase. Числа React считает пикселями, кроме свойств без единиц вроде `opacity` и `lineHeight`. Строка вместо объекта — ошибка типов и падение при рендере (шаг «Атрибуты»).
    step: 02-attributes

  - question: |
      У игры `inStock` равен `0`. Что отрисует эта строка?

      ```tsx
      {game.inStock && <p>На складе: {game.inStock} шт.</p>}
      ```
    options:
      - 'Одинокий символ `0` на месте абзаца'
      - 'Ничего: условие ложно, и абзац не рисуется'
      - 'Абзац «На складе: 0 шт.»'
      - 'Ничего, а TypeScript сообщит об ошибке типов'
    explanation: |
      `0 && …` возвращает левую часть — `0`, а ноль, в отличие от `false`, React рисует. TypeScript молчит: `0` — допустимый `ReactNode`. Слева от `&&` нужно логическое значение: `game.inStock > 0 && …` (шаг «Условный рендер»).
    step: 03-conditional

  - question: |
      Когда в компоненте уместнее всего ранний `return`?
    options:
      - 'Когда условие меняет всё, что показывает компонент: «загружается», «ошибка», «не найдено»'
      - 'Когда внутри разметки нужно показать один из двух элементов: кнопку или надпись'
      - 'Когда небольшой элемент разметки нужно либо показать, либо не показывать ничего'
      - 'Никогда: компонент обязан иметь ровно один `return` с JSX в конце функции'
    explanation: |
      Компонент — обычная функция и может вернуть разное. Ранний `return` хорош, когда условие заменяет всю разметку; для «показать или ничего» внутри разметки есть `&&`, для «одно или другое» — `? :` (шаг «Условный рендер»).
    step: 03-conditional

  - question: |
      Каталог выводится через `games.map((game) => <article key={…}>…</article>)`. Какой ключ правильный?
    options:
      - '`game.id` — уникален среди соседей и одинаков у игры при каждом рендере'
      - '`Math.random()` — гарантирует, что ключи никогда не совпадут'
      - '`index` из `map` — всегда уникален и не зависит от данных'
      - 'Никакой: TypeScript не требует `key`, значит он не нужен'
    explanation: |
      Ключ должен быть уникальным среди соседей и устойчивым. `Math.random()` даёт новые ключи при каждом рендере, индекс ломается, когда список меняется, а без `key` React предупреждает в консоли: TypeScript молчит, но React сопоставлять элементы не может (шаг «Списки»).
    step: 04-lists

  - question: |
      Что не так с этим кодом?

      ```tsx
      <dl>
        {specs.map((spec) => (
          <>
            <dt>{spec.label}</dt>
            <dd>{spec.value}</dd>
          </>
        ))}
      </dl>
      ```
    options:
      - 'У `<>…</>` нельзя указать `key` — в списке нужен `<Fragment key={spec.label}>`'
      - 'Фрагмент нельзя возвращать из `map` — код не соберётся с ошибкой сборки'
      - 'Ничего: фрагменты не попадают в DOM, поэтому ключ им не нужен'
      - 'Пару нужно обернуть в `<div key>`: фрагменты в списках не поддерживаются'
    explanation: |
      Код работает, но в консоли `Each child in a list should have a unique "key" prop.` — у короткой записи нет атрибутов, в том числе `key`. Обёртка `<div>` сломала бы вёрстку `<dl>`, которая рассчитывает на прямых потомков (шаг «Фрагменты»).
    step: 05-fragments

  - question: |
      Компонент `App` возвращает `<><header>…</header><main>…</main></>`. Что окажется внутри `#root`?
    options:
      - 'Два элемента подряд: `<header>` и `<main>`'
      - 'Один `<div>`, а в нём `<header>` и `<main>`'
      - 'Элемент `<template>` с `<header>` и `<main>` внутри'
      - 'Только `<header>`: из фрагмента берётся первый элемент'
    explanation: |
      Фрагмент собирает элементы в один для React, но DOM-элемента для него не создаётся: его дочерние элементы становятся детьми родителя. Проверка в уроке печатает `["HEADER", "MAIN"]` (шаг «Фрагменты»).
    step: 05-fragments

  - question: |
      Что увидит пользователь?

      ```tsx
      const review = 'Игра <b>отличная</b>';

      <p>{review}</p>
      ```
    options:
      - 'Текст вместе с тегами: `Игра <b>отличная</b>`'
      - 'Текст «Игра отличная», где «отличная» — жирным'
      - 'Текст «Игра отличная»: React вырезает теги'
      - 'Ошибку: HTML-строки выводят только через `dangerouslySetInnerHTML`'
    explanation: |
      Всё, что попадает в JSX через фигурные скобки, React вставляет как текст — экранирует, и браузер не разбирает строку как HTML. Это защита от XSS по умолчанию (шаг «Безопасность»).
    step: 06-security

  - question: |
      В `dangerouslySetInnerHTML={{ __html: html }}` попала строка `<img src="x" onerror="…">`. Что произойдёт?
    options:
      - 'React запишет строку как есть, и код из `onerror` выполнится'
      - 'React вырежет `onerror` при санитизации, как Angular в `[innerHTML]`'
      - 'React заблокирует опасный атрибут и выведет ошибку в консоль'
      - 'React покажет разметку как текст, как и у выражений в `{}`'
    explanation: |
      React не очищает HTML: `dangerouslySetInnerHTML` записывает строку в `innerHTML` без проверки. HTML от пользователя туда попадает только после очистки, например DOMPurify (шаг «Безопасность»).
    step: 06-security

  - question: |
      Адрес ссылки пришёл из данных: `<a href={url}>Правила</a>`, а в `url` — `javascript:…`. Что сделает React 19 при щелчке?
    options:
      - 'Код не выполнится: React подменил адрес и в консоли ошибка о блокировке'
      - 'Код выполнится: React проверяет протокол только в `dangerouslySetInnerHTML`'
      - 'Код выполнится, а в консоли появится только предупреждение'
      - 'Ссылка не появится: React не рисует элемент с опасным адресом'
    explanation: |
      React 19 подменяет `javascript:`-адреса в `href`, `src`, `action` и `formAction` на код, который бросает `React has blocked a javascript: URL…`. Но только в атрибутах, которые ставит сам React: такая же ссылка внутри `dangerouslySetInnerHTML` выполнится. Только предупреждение было до React 19 (шаг «Безопасность»).
    step: 06-security

  - question: |
      В строке «Остров сокровищ» ввели заметку и нажали «Перевернуть список». Где окажется заметка?

      ```tsx
      {list.map((game, index) => (
        <li key={index}>
          <label>
            {game.title} <input placeholder="Заметка" />
          </label>
        </li>
      ))}
      ```
    options:
      - 'В первой строке — теперь рядом с «Маяком»'
      - 'В последней строке — вместе с «Островом сокровищ»'
      - 'Нигде: React пересоздаст все строки с пустыми полями'
      - 'Нигде: React бросит ошибку из-за ключей-индексов'
    explanation: |
      Ключ `0` был и остался, тип тот же — для React это тот же `<li>`: он меняет текст названия, а DOM-узел с полем и введённым значением остаётся на месте. С `key={game.id}` заметка уехала бы вместе с игрой, а с `Math.random()` пропала бы (шаг «Под капотом: почему key»).
    step: 07-keys

  - question: |
      Теги игры — массив строк без id: `game.tags.map((tag) => <li key={…}>#{tag}</li>)`. Какой ключ подходит?
    options:
      - '`tag` — строки внутри одной игры уникальны, а большего от ключа не требуется'
      - '`game.id` — он устойчив и уже используется как ключ карточки'
      - '`crypto.randomUUID()` — так создают id, когда его нет в данных'
      - '`index` — раз id нет, индекс остаётся единственным вариантом'
    explanation: |
      Ключ должен быть уникален только среди соседей одного родителя, и сам тег этому отвечает. `game.id` одинаков у всех тегов игры, а id, сгенерированный при рендере, меняется каждый раз — как `Math.random()`; `crypto.randomUUID()` вызывают при добавлении элемента и хранят с данными (шаги «Практикум» и «Под капотом: почему key»).
    step: 08-practice
