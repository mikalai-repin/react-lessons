# Квиз главы «Компоненты и props». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `App` вместо `<Header />` по ошибке написали `<header />`. Что произойдёт?
    options:
      - 'Шапка пропадёт без сообщений в консоли: React нарисует пустой HTML-тег `<header>`'
      - 'React найдёт компонент `Header` без учёта регистра и нарисует шапку как обычно'
      - 'Приложение упадёт с ошибкой «компонент header не найден» в консоли превью'
      - 'React нарисует шапку и выведет предупреждение, что имя нужно писать с большой буквы'
    explanation: |
      Имя с маленькой буквы JSX считает HTML-тегом, а `<header>` — настоящий тег, поэтому React молча рисует пустой `<header></header>`. Подсказывает только редактор: импорт `Header` больше не используется (шаг «Свой компонент»).
    step: 01-component

  - question: |
      Почему компонент нельзя объявлять внутри другого компонента?
    options:
      - 'При каждом рендере родителя это новая функция — новый тип, и React пересоздаёт её DOM вместе с состоянием'
      - 'TypeScript не разрешает объявлять функции, возвращающие JSX, внутри других функций'
      - 'Вложенный компонент нельзя экспортировать, поэтому React не находит его при рендере'
      - 'React вызывает вложенный компонент только один раз и не обновляет его при новых props'
    explanation: |
      Код заработает, но при каждом рендере родителя создаётся новая функция, и для React это другой `type`. Он удаляет старое поддерево и создаёт новое — поле ввода внутри такого компонента теряло текст при каждой перерисовке (шаг «Свой компонент», «Под капотом»).
    step: 01-component

  - question: |
      Что окажется в `props` компонента `GameCard`?

      ```tsx
      {games.map((game) => (
        <GameCard key={game.id} game={game} />
      ))}
      ```
    options:
      - 'Только `{ game }` — `key` забирает React, в props его нет'
      - '`{ key, game }` — все атрибуты элемента попадают в props'
      - '`{ game, id }` — React переименовывает `key` в `id`'
      - '`{ game, children }` — `children` есть у каждого компонента'
    explanation: |
      `key` — служебный атрибут: он передаётся в `jsxDEV` отдельным аргументом и попадает в `element.key`, а не в `props`. Попытка прочитать `props.key` — `undefined` и ошибка «`key` is not a prop» (шаг «Props»).
    step: 02-props

  - question: |
      У `Header` обязательный проп `count: number`. Что будет, если написать `<Header />`?
    options:
      - 'Ошибка типов, но приложение работает: на месте числа пусто, потому что `undefined` не рисуется'
      - 'Приложение не запустится: без обязательного пропа сборка останавливается, как при синтаксической ошибке'
      - 'React подставит значение по умолчанию для числа — `0` — и выведет предупреждение в консоль'
      - 'Ошибки типов нет, а React бросит исключение при рендере, потому что `count` не передан'
    explanation: |
      TypeScript сообщит `Property 'count' is missing…`, но ошибки типов запуск не останавливают. Значение пропа — `undefined`, а его React не рисует: «в каталоге игр» (шаг «Props»).
    step: 02-props

  - question: |
      Что получит `Badge` в `children`?

      ```tsx
      <Badge tone="warning">Осталось {game.inStock} шт.</Badge>
      ```

      У игры `inStock` равен `3`.
    options:
      - 'Массив `["Осталось ", 3, " шт."]`'
      - 'Строку `"Осталось 3 шт."`'
      - 'Строку `"Осталось {game.inStock} шт."`'
      - 'Число `3` — текст вокруг отбрасывается'
    explanation: |
      Когда текст перемешан с выражениями, каждый кусок текста и каждое `{…}` становятся отдельным элементом массива. Строкой `children` бывает, только если между тегами один текст, как у «Хит» (шаг «children»).
    step: 03-children

  - question: |
      Как поведёт себя React 19 с таким кодом?

      ```tsx
      export function Badge({ children, tone }: BadgeProps) { … }
      Badge.defaultProps = { tone: 'accent' };
      ```
    options:
      - 'Проигнорирует `defaultProps` молча: `tone` останется `undefined`'
      - "Подставит `tone: 'accent'`, но выведет предупреждение об устаревшем API"
      - "Подставит `tone: 'accent'` так же, как значение в деструктуризации"
      - 'Упадёт при рендере с ошибкой «defaultProps is not supported»'
    explanation: |
      У функциональных компонентов `defaultProps` в React 19 не работают, причём без предупреждений — у бейджа оказался класс `undefined`. Значения по умолчанию задают в деструктуризации: `tone = 'accent'` (шаг «children»).
    step: 03-children

  - question: |
      В раздел передали `{GameCard}` вместо элемента. Что произойдёт?

      ```tsx
      <Section title="Все игры">{GameCard}</Section>
      ```
    options:
      - 'Ошибка типов и сообщение «Functions are not valid as a React child»: нужен элемент `<GameCard … />`'
      - 'React сам вызовет функцию `GameCard` без props и нарисует пустую карточку на этом месте'
      - 'React выведет текст функции — её исходный код — строкой внутри раздела, как любое значение'
      - 'Ничего: функции, как `null` и `false`, React не рисует и молча пропускает без сообщений'
    explanation: |
      Слот ждёт `ReactNode` — то, что получается из JSX, — а `GameCard` это функция. TypeScript пишет `… is not assignable to type 'ReactNode'`, React — «Functions are not valid as a React child. This may happen if you return GameCard instead of <GameCard /> …» (шаг «Несколько слотов»).
    step: 04-slots

  - question: |
      В `GameCard` добавили строку `if (isHit(game)) game.tags.push('хит');`. «Остров сокровищ» есть и в «Хитах», и во «Всех играх». Почему у второй карточки «хитов» больше, чем у первой?
    options:
      - 'Обе карточки получили один и тот же объект игры, и каждый вызов компонента дописывал тег в общий массив'
      - 'Каждая карточка получила свою копию игры, но React склеивает теги карточек с одинаковым ключом'
      - 'React замораживает props, поэтому `push` срабатывает только во второй карточке, а в первой — нет'
      - 'Второй раздел рисуется дважды из-за строгого режима, а первый раздел рисуется только один раз'
    explanation: |
      Props передают ссылку, а не копию. Каждый вызов `GameCard` (а строгий режим вызывает каждую карточку дважды) дописывал тег в один и тот же массив: в «Хитах» — два «хита», во «Всех играх» — уже четыре (шаг «Однонаправленный поток»).
    step: 05-one-way

  - question: |
      Что произойдёт в режиме разработки?

      ```tsx
      export function GameCard(props: GameCardProps) {
        props.game = { ...props.game, price: 0 };
        …
      ```
    options:
      - 'Ошибки типов нет, но рендер упадёт: React замораживает объект props'
      - 'Все карточки покажут цену 0 ₽ — props можно менять, как любой объект'
      - 'TypeScript не пропустит код: поля props всегда только для чтения'
      - 'React молча отбросит присваивание и нарисует карточку с прежней ценой'
    explanation: |
      В разработке React замораживает props (`Object.freeze`), и присваивание бросает `TypeError: Cannot assign to read only property 'game'…`. Заморозка неглубокая: `game.tags.push` при этом проходит. TypeScript молчит, пока props не объявлены `Readonly` (шаг «Однонаправленный поток»).
    step: 05-one-way

  - question: |
      Зачем обёртке `Button` значение по умолчанию `type = 'button'`?
    options:
      - 'По стандарту HTML `<button>` без `type` — это `submit`: внутри формы нажатие отправило бы её'
      - 'Без `type` React не передаёт кнопке обработчик `onClick`, и нажатия не обрабатываются'
      - 'TypeScript требует `type` у каждого `<button>`, иначе `ComponentProps` не компилируется'
      - 'Без `type` класс `.button` из `styles.css` не применяется, потому что селектор его требует'
    explanation: |
      `<button>` без атрибута `type` по умолчанию отправляет форму, в которой лежит. Обёртка ставит `type="button"`, а если нужно отправить форму — передают `type="submit"` (шаг «Типизация компонентов»).
    step: 06-typing

  - question: |
      Почему этот компонент не компилируется?

      ```tsx
      type StockProps =
        | { status: 'available'; inStock: number }
        | { status: 'soldOut' };

      function Stock({ status, inStock }: StockProps) { … }
      ```
    options:
      - 'До проверки `status` поля `inStock` может не быть — деструктуризация его не видит'
      - 'Union-тип нельзя использовать для props: нужен `interface` с необязательными полями'
      - 'Компонент обязан принимать `children`, а в обоих вариантах union-типа его нет'
      - 'У поля `status` нет значения по умолчанию, а деструктуризация его требует'
    explanation: |
      У варианта `soldOut` нет `inStock`, поэтому TypeScript пишет `Property 'inStock' does not exist on type 'StockProps'`. Props union-типа принимают целиком и сужают проверкой: `if (props.status === 'soldOut') …`, после неё `props.inStock` доступен (шаг «Типизация компонентов»).
    step: 06-typing

  - question: |
      В каждый компонент добавили `console.log` с его именем. Почему в логе `Badge 3` (бейдж рядом с заголовком «Хиты») идёт раньше первой карточки?

      ```
      App
      Header
      Section Хиты
      Badge 3
      GameCard Остров сокровищ
      ```
    options:
      - 'React обходит дерево в глубину, а бейдж стоит в разметке раздела раньше сетки карточек'
      - 'React сначала вызывает все маленькие компоненты, а потом крупные, чтобы быстрее показать экран'
      - 'Бейдж создан в `App`, поэтому React вызывает его вместе с `App`, ещё до вызова `Section`'
      - 'React вызывает компоненты в алфавитном порядке их имён, а `Badge` идёт раньше `GameCard`'
    explanation: |
      React вызвал `App`, получил элементы и пошёл по ним в глубину. `Section` «Хиты» вернул шапку с бейджем и затем сетку, поэтому бейдж раскрыт раньше карточек. Элемент `<Badge>` создан в `App`, но функцию `Badge` вызывает React, когда доходит до этого места (шаг «Под капотом»).
    step: 07-trees

  - question: |
      В «Хитах» карточки нарисовали вызовом функции: `{hits.map((game) => GameCard({ game }))}`. Что изменилось?
    options:
      - '`GameCard` исчез из дерева компонентов: для React его разметку вернул `App`'
      - 'Ничего: React сам превращает вызов компонента в элемент `<GameCard />`'
      - 'Карточки не нарисуются: компонент нельзя вызвать без участия React'
      - 'Каждая карточка нарисуется дважды: и вызовом, и как элемент списка'
    explanation: |
      Карточки на месте, но файбера `GameCard` больше нет — путь от кнопки ведёт `article ← div`, минуя карточку, а предупреждение про `key` обвиняет `App`. Состояние такой «карточки» в главе 4 досталось бы `App`. Компоненты рисуют через JSX (шаг «Под капотом»).
    step: 07-trees

  - question: |
      Почему в `Rating` ключом звезды можно взять индекс: `key={i}`?
    options:
      - 'Звёзды не переставляются, не фильтруются и не хранят состояния — позиция и есть идентичность'
      - 'Для элементов внутри компонента React вообще не использует ключи, поэтому любой ключ подходит'
      - 'Индекс — рекомендуемый ключ для любых списков, а id из данных нужен только в таблицах'
      - 'Символ звезды одинаковый у всех элементов, поэтому React сам подберёт им уникальные ключи'
    explanation: |
      Ключ-индекс безопасен, только когда список не меняет порядок и состав, а у элементов нет своего состояния. Звёзды рейтинга — именно такой случай (практикум, подсказка про ключ; «Под капотом: почему key» в главе 2).
    step: 08-practice
