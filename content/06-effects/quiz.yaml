# Квиз главы «Ссылки и эффекты». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `showToast` добавили логи. Покупатель нажал «В корзину» у «Острова сокровищ», а сразу после — у «Нардов». Что напечатает строка «после» при втором щелчке?

      ```tsx
      console.log('до:', toastTimer.current, toast);
      toastTimer.current = setTimeout(() => setToast(null), TOAST_MS);
      console.log('после:', toastTimer.current, toast);
      ```
    options:
      - 'Номер нового таймера и «Добавлено: Остров сокровищ» — ссылка меняется сразу, состояние остаётся снимком'
      - 'Номер нового таймера и «Добавлено: Нарды» — после `setToast` и ссылка, и состояние уже новые'
      - 'Номер прошлого таймера и «Добавлено: Остров сокровищ» — ссылка обновится только при рендере'
      - '`null` и `null` — и ссылка, и состояние создаются заново при каждом рендере'
    explanation: |
      Запись в `current` видна на следующей строке, а `toast` внутри обработчика — снимок рендера, в котором обработчик вызван: при втором щелчке это текст первого уведомления (шаг «useRef: значение без рендера»).
    step: 01-ref-values

  - question: |
      Чем `useRef` отличается от `useState`?
    options:
      - 'Значение тоже переживает рендеры, но его изменение не вызывает рендер'
      - 'Значение не переживает рендеры, зато меняется без вызова сеттера'
      - 'Значение переживает рендеры, но его можно менять только в эффектах'
      - 'Значение то же, но рендер после изменения откладывается до следующего события'
    explanation: |
      React создаёт объект `{ current }` при первом рендере и возвращает тот же объект при каждом следующем; никакой подписки на `current` нет. Поэтому в ссылке держат то, что не рисуется: id таймера, DOM-элемент, экземпляр библиотеки (шаг «useRef: значение без рендера»).
    step: 01-ref-values

  - question: |
      Что напечатает эта строка при первом запуске магазина (в строгом режиме)?

      ```tsx
      const searchRef = useRef<HTMLInputElement>(null);
      console.log('render App, поле:', searchRef.current);
      ```
    options:
      - 'Дважды `render App, поле: null` — при рендере поле ещё не создано'
      - 'Дважды `render App, поле: <input>` — React создаёт элемент до вызова компонента'
      - 'Один раз `null`, второй раз `<input>` — второй рендер строгого режима видит поле'
      - 'Ничего: читать ссылку при рендере React запрещает ошибкой'
    explanation: |
      React кладёт элемент в `current` во время фиксации, после рендера. При запуске оба вызова `App` (строгий режим) видят `null`, и только после ввода буквы — `<input>`. Поэтому ссылки читают в обработчиках и эффектах (шаг «Ссылки на DOM»).
    step: 02-dom-refs

  - question: |
      Из типа props `CatalogFilters` убрали `ref?: Ref<HTMLInputElement>` и не передают его полю, а `App` по-прежнему пишет `<CatalogFilters ref={searchRef} …>`. Что будет?
    options:
      - 'Ошибка типов на `ref`, а в превью консоль молчит и фокус после сброса не ставится'
      - 'Ошибки типов нет, а React предупредит: функциональным компонентам ссылки не передают'
      - 'Ошибка типов на `ref`, а приложение упадёт: `searchRef.current` равен `undefined`'
      - 'Ошибки нет: React 19 сам передаст ссылку первому `<input>` внутри компонента'
    explanation: |
      В React 19 `ref` — обычный проп: React кладёт его в props, но компонент никуда его не отдал. TypeScript: «Property 'ref' does not exist on type 'IntrinsicAttributes & CatalogFiltersProps'». `searchRef.current` остаётся `null`, `?.focus()` ничего не делает (шаг «Ссылки на DOM»).
    step: 02-dom-refs

  - question: |
      `ConfirmDialog` открывает наружу ссылку через `useImperativeHandle(ref, () => ({ open() { … } }))`. Что напечатает родитель?

      ```tsx
      console.log('ref:', confirmRef.current);
      ```
    options:
      - '`ref: { open: ƒ open() }` — только объект, который вернула функция'
      - '`ref: <dialog>` — к объекту React добавляет сам элемент'
      - '`ref: null` — объект из `useImperativeHandle` доступен только внутри окна'
      - '`ref: <dialog>` с методом `open` — React дописывает метод элементу'
    explanation: |
      После фиксации React записывает в `ref.current` родителя то, что вернула функция, — DOM-элемент остаётся во внутренней ссылке окна. Вызов `confirmRef.current?.close()` — ошибка типов «Property 'close' does not exist on type 'ConfirmDialogHandle'» (шаг «useImperativeHandle»).
    step: 03-imperative-handle

  - question: |
      В `Countdown` у эффекта убрали массив зависимостей. Что покажет консоль, пока открыта страница игры?

      ```tsx
      useEffect(() => {
        if (finished) return;
        console.log('таймер: старт');
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => {
          console.log('таймер: стоп');
          clearInterval(id);
        };
      });
      ```
    options:
      - 'Каждую секунду «таймер: стоп» и «таймер: старт» — эффект после каждого рендера'
      - 'Одну строку «таймер: старт» — без массива эффект выполняется один раз'
      - 'Ничего — без массива зависимостей React не запускает эффект'
      - 'Бесконечный поток строк и ошибку «Maximum update depth exceeded»'
    explanation: |
      Без массива эффект выполняется после каждой фиксации. Тик интервала вызывает рендер, а рендер — очистку и новую настройку: таймер работает, но пересоздаётся каждую секунду. С `[finished]` — один интервал на всю акцию (шаг «useEffect»).
    step: 04-use-effect

  - question: |
      Что будет с эффектом `useEffect(async () => { … })`?
    options:
      - 'TypeScript подчеркнёт его, а React при запуске сообщит об ошибке: эффект вернул промис вместо очистки'
      - 'Всё сработает: React дождётся промиса и вызовет очистку после его завершения'
      - 'Сработает, но React предупредит, что асинхронные эффекты выполняются дважды'
      - 'TypeScript промолчит, а React молча проигнорирует возвращённый промис'
    explanation: |
      Асинхронная функция возвращает промис, а React ждёт функцию очистки или ничего. TS: «… is not assignable to type 'void | Destructor'», в консоли — «useEffect must not return anything besides a function, which is used for clean-up», приложение падает. Асинхронный код пишут внутри эффекта и вызывают сразу (шаг «useEffect»).
    step: 04-use-effect

  - question: |
      Почему при открытии игры консоль показывает `таймер: старт`, `таймер: стоп`, `таймер: старт`?
    options:
      - 'Строгий режим в разработке имитирует уход и возвращение компонента, чтобы проверить очистку'
      - 'React рендерит компонент дважды, и каждый рендер запускает свой эффект'
      - 'Первый эффект прерван конкурентным рендером и запущен заново'
      - 'Так работает каждый эффект с зависимостями — и в продакшен-сборке тоже'
    explanation: |
      При первом появлении компонента строгий режим вызывает очистку всех его эффектов и настраивает их снова — состояние при этом не сбрасывается. Без `StrictMode` в логе одна строка `таймер: старт`, в продакшен-сборке — тоже одна (шаг «Эффекты в строгом режиме»).
    step: 05-strict-mode

  - question: |
      Чтобы эффект `Countdown` не запускался дважды в строгом режиме, в него добавили флажок. Что увидит покупатель на странице «Острова сокровищ»?

      ```tsx
      const started = useRef(false);
      useEffect(() => {
        if (finished || started.current) return;
        started.current = true;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [finished]);
      ```
    options:
      - 'Время на таймере стоит на месте: первый интервал очищен, а второй флажок не запустил'
      - 'Таймер идёт как обычно, а в консоли теперь одна строка вместо трёх'
      - 'Таймер идёт вдвое быстрее: флажок не помешал второму интервалу'
      - 'Ошибку: ссылку нельзя менять внутри эффекта'
    explanation: |
      Строгий режим вызвал очистку (интервал остановлен), а повторную настройку не пустил флажок — ссылки при имитации не сбрасываются. Лог: `старт`, `стоп` — и «Скидка действует ещё 2:00:00» не меняется. Правильный ответ на двойной запуск — верная очистка (шаг «Эффекты в строгом режиме»).
    step: 05-strict-mode

  - question: |
      Чем плох этот код в `MiniCart`?

      ```tsx
      const [total, setTotal] = useState(0);
      useEffect(() => {
        setTotal(/* сумма позиций */);
      }, [items, games]);
      ```
    options:
      - 'Лишний рендер на каждое изменение и неверный итог в DOM между ними — сумму нужно вычислить при рендере'
      - 'Ничем, если в зависимостях все значения, которые читает эффект'
      - 'Итог не обновится: React не запускает эффекты из-за изменения props'
      - 'Это бесконечный цикл: `setTotal` в эффекте снова его запускает'
    explanation: |
      Сначала React фиксирует «Итого: 0 ₽», затем эффект вызывает `setTotal` и второй рендер — четыре строки `render MiniCart` вместо двух. Производное значение — `const total = …` при рендере; внешней системы у этого эффекта нет (шаг «Возможно, эффект не нужен»).
    step: 06-no-effect

  - question: |
      Уведомление «Добавлено: …» показывает эффект, который следит за `lastAdded` (`handleAdd` делает `setLastAdded(gameId)`). Покупатель дважды добавил «Остров сокровищ» с паузой в полторы секунды. Что не так?
    options:
      - 'Второй щелчок не продлил уведомление: `lastAdded` не изменился, эффект не запустился'
      - 'Уведомление показалось дважды: эффект выполняется на каждый вызов `setLastAdded`'
      - 'Ничего: уведомление провисит 2,5 секунды после второго щелчка'
      - 'Уведомления не будет совсем: эффекты не видят состояние, заданное в обработчике'
    explanation: |
      Эффект отвечает на «что сейчас на экране», а не на «что произошло». Второй щелчок записал то же `1`, и уведомление исчезло примерно через секунду. Реакция на действие пользователя — в обработчике события (шаг «Возможно, эффект не нужен»).
    step: 06-no-effect

  - question: |
      Эффект аналитики — с зависимостью `[game.id]`. Покупатель открыл «Остров сокровищ» и в первую секунду добавил его в корзину. Что уйдёт в аналитику через 3 секунды?

      ```tsx
      useEffect(() => {
        const id = setTimeout(
          () => track('просмотр', { gameId: game.id, inCart: quantity }),
          VIEW_DELAY,
        );
        return () => clearTimeout(id);
      }, [game.id]);
      ```
    options:
      - '`{ gameId: 1, inCart: 0 }` — таймер держит функцию из первого рендера'
      - '`{ gameId: 1, inCart: 1 }` — функция читает `quantity` в момент вызова'
      - 'Ничего: изменение `quantity` вызвало очистку и отменило таймер'
      - 'Два события: с `inCart: 0` и с `inCart: 1`'
    explanation: |
      Это устаревшее замыкание: эффект не перезапускался, и стрелочная функция видит `quantity` первого рендера. Добавить `quantity` в зависимости — перезапуск таймера и лишний «просмотр» на каждое добавление. Нереактивное чтение выносят в `useEffectEvent` (шаг «useEffectEvent»).
    step: 07-effect-event

  - question: |
      Почему положение подсказки вычисляют в `useLayoutEffect`, а не в `useEffect`?
    options:
      - '`useLayoutEffect` выполняется до отрисовки, и пользователь не увидит подсказку на неверном месте'
      - '`useEffect` выполняется до вставки элементов в DOM, и размер подсказки ещё неизвестен'
      - '`useLayoutEffect` выполняется во время рендера, и замер попадает прямо в разметку'
      - '`useEffect` нельзя использовать с `getBoundingClientRect` — он вернёт нули'
    explanation: |
      Оба хука выполняются после изменения DOM, и замер в обоих работает. Но `useEffect` может выполниться после кадра: с замедленным процессором лог показал `кадр, left = не задан`, затем `замер` — подсказка успела нарисоваться в углу окна. `useLayoutEffect` и вызванный в нём `setPosition` успевают до кадра (шаг «useLayoutEffect и порталы»).
    step: 08-layout-portal

  - question: |
      `getSnapshot` для `useSyncExternalStore` переписали так. Что произойдёт?

      ```tsx
      function getSnapshot() {
        return { online: navigator.onLine };
      }
      ```
    options:
      - 'Бесконечный цикл: React сообщит, что снимок нужно кэшировать, и приложение упадёт'
      - 'Ничего: React сравнит объекты по содержимому и не заметит разницы'
      - 'Компонент будет рендериться только при событиях `online` и `offline`, как раньше'
      - 'TypeScript не пропустит: снимок должен быть примитивом'
    explanation: |
      Каждый вызов даёт новый объект, `Object.is` всегда видит изменение. В консоли — «The result of getSnapshot should be cached to avoid an infinite loop» и «Maximum update depth exceeded». Снимок должен оставаться тем же значением, пока хранилище не изменилось (шаг «Внешние хранилища»).
    step: 09-external-store

  - question: |
      В каком порядке выполнятся обычные эффекты родителя и вложенного в него потомка после щелчка, и когда относительно отрисовки кадра?
    options:
      - 'Сначала потомок, потом родитель — и всё до кадра: после щелчка эффекты не откладываются'
      - 'Сначала родитель, потом потомок — эффекты идут в том же порядке, что и рендер'
      - 'Сначала потомок, потом родитель — всегда после кадра, отдельной задачей'
      - 'Порядок не определён: React выполняет эффекты параллельно'
    explanation: |
      Рендер идёт сверху вниз, а фиксация и эффекты — снизу вверх: `effect Child`, затем `effect Parent`. Щелчок — дискретное событие, и пассивные эффекты выполняются в той же задаче, что и фиксация, до `· кадр`. После наведения, таймера и при запуске — отдельной задачей (шаг «Под капотом: когда выполняются эффекты»).
    step: 10-under-the-hood
