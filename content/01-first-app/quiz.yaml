# Квиз главы «Первое приложение». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Какую задачу React решает сам, без библиотек экосистемы?
    options:
      - Рисует интерфейс по данным и обновляет его, когда данные меняются
      - Переключает страницы приложения при смене адреса в браузере
      - Отправляет запросы к серверу и кэширует полученные ответы
      - Проверяет ввод в формах и показывает сообщения об ошибках
    explanation: |
      React — библиотека с одной задачей: по данным нарисовать интерфейс и поддерживать его актуальным. Роутинг, запросы, формы и общее состояние берут из экосистемы: React Router, TanStack Query, React Hook Form и других (шаг «Что такое React»).
    step: 01-what-is-react

  - question: |
      Компонент назвали с маленькой буквы. Что произойдёт при запуске?

      ```tsx
      function app() {
        return <h1>Ход конём</h1>;
      }

      createRoot(container).render(<app />);
      ```
    options:
      - React создаст пустой DOM-элемент `<app>` и предупредит в консоли
      - React вызовет функцию `app`, и на странице появится заголовок
      - Сборка не пройдёт, и приложение не запустится совсем
      - React бросит ошибку рендера и уберёт всё дерево компонентов
    explanation: |
      По первой букве React отличает компоненты от тегов HTML: `<app />` для него — тег, функцию он не вызывает. В консоли появится `The tag <app> is unrecognized in this browser…`, а ошибка типов от TypeScript запуск не останавливает (шаг «Первый компонент»).
    step: 02-first-component

  - question: |
      Почему `createRoot` импортируют из `react-dom/client`, а не из `react`?
    options:
      - Пакет `react` ничего не знает о браузере, а `react-dom` умеет рисовать в DOM
      - Пакет `react` содержит только хуки, а компоненты описываются в `react-dom`
      - Из `react` функцию `createRoot` удалили в React 19, оставив копию в `react-dom`
      - Путь `react-dom/client` нужен, чтобы приложение работало без сборщика
    explanation: |
      Корень создаётся для конкретного DOM-элемента, а работа с DOM — дело пакета `react-dom`. Сам `react` о браузере не знает (шаг «Запуск приложения»). Удалили в React 19 другую функцию — `ReactDOM.render`.
    step: 03-render

  - question: |
      Что выведет `console.log`?

      ```tsx
      const root = createRoot(container);
      root.render(<App />);
      console.log(container.innerHTML);
      ```
    options:
      - Пустую строку — React нарисует `App` позже, отдельной задачей
      - Разметку `App` — `render` создаёт элементы сразу при вызове
      - Строку `<App></App>` — React сначала вставляет тег компонента
      - Разметку `App`, но без текста — текст React добавляет позже
    explanation: |
      Вызов `render` не рисует сразу, а только просит React нарисовать: работа планируется и выполняется после того, как текущий код закончится. Разметка видна, например, в `setTimeout(…, 100)`; нарисовать немедленно можно через `flushSync` (шаг «Запуск приложения»).
    step: 03-render

  - question: |
      Приложение запущено в режиме разработки. Сколько раз при первом показе выполнится `console.log`?

      ```tsx
      export function App() {
        console.log('render App');
        return <h1>Ход конём</h1>;
      }

      root.render(
        <StrictMode>
          <App />
        </StrictMode>,
      );
      ```
    options:
      - Дважды — строгий режим в разработке вызывает компонент повторно
      - Один раз — строгий режим только предупреждает об устаревших API
      - Один раз — второй вызов будет, только если данные изменятся
      - Дважды — и в продакшен-сборке тоже, строгий режим там остаётся
    explanation: |
      `StrictMode` в разработке вызывает каждый компонент дважды, чтобы найти нечистые; в консоли превью — `render App` со счётчиком 2. В продакшен-сборке он ничего не делает, и компонент вызывается один раз (шаг «Строгий режим»).
    step: 04-strict-mode

  - question: |
      Из-за двойного вызова в строгом режиме счётчик вызовов компонента растёт на 2 вместо 1. Как правильно поступить?
    options:
      - Сделать компонент чистым — он меняет что-то снаружи, это ошибка в нём
      - Убрать `StrictMode` из `main.tsx` — он нужен только для отладки
      - Делить счётчик на 2, когда приложение работает в режиме разработки
      - Ничего не делать — в продакшене ошибка исчезнет вместе с проверкой
    explanation: |
      Двойной вызов «чинить» не нужно: он показывает, что компонент не чистый — меняет что-то вне себя. В продакшене та же ошибка проявится иначе и позже (шаг «Строгий режим»).
    step: 04-strict-mode

  - question: |
      Почему класс элементу в JSX задают атрибутом `className`, а не `class`?
    options:
      - JSX превращается в JavaScript, а там `class` — ключевое слово
      - Атрибут `class` в JSX зарезервирован под классы из CSS Modules
      - Через `className` сборка делает имя класса уникальным
      - В React 19 атрибут `class` удалили, раньше писали именно так
    explanation: |
      JSX компилируется в JavaScript, где `class` — ключевое слово, поэтому React берёт название свойства DOM: у элемента в браузере тоже `element.className` (шаг «Стили»).
    step: 05-styles

  - question: |
      Почему класс `.title` из `App.module.css` не заденет элементы с классом `title` в других компонентах?
    options:
      - Сборка переименовывает класс в уникальный, а `styles` хранит новое имя
      - React вставляет стили модуля только внутрь элемента своего компонента
      - Стили модуля действуют, только пока компонент рисуется впервые
      - CSS Modules добавляют к каждому правилу селектор `#root`
    explanation: |
      Заголовок получает не `title`, а что-то вроде `App_title_x7k2p`; объект `styles` хранит соответствие «`title` → новое имя». Поэтому `.title` в другом компоненте с ним не пересечётся (шаг «Стили»).
    step: 05-styles

  - question: |
      Массив `hits` пустой. Что произойдёт при запуске?

      ```tsx
      const hits: string[] = [];

      export function App() {
        return <p>Хит недели: {hits[0].toUpperCase()}</p>;
      }
      ```
    options:
      - Ошибка во время рендера — React уберёт всё дерево, страница пустая
      - Пропадёт только абзац, остальная страница останется на экране
      - Сборка не пройдёт, а консоль покажет ошибку с меткой «Сборка»
      - TypeScript найдёт ошибку типов и не даст приложению запуститься
    explanation: |
      Для TypeScript элемент `string[]` — это `string`, поэтому код собирается, но падает, когда React вызывает `App`. Если компонент падает во время рендера, React не знает, что показать на его месте, и убирает всё дерево; перехватывать такие ошибки умеют границы ошибок (шаг «Отладка»).
    step: 06-debugging

  - question: |
      В консоли превью строка с меткой «TS». Что это значит для приложения?
    options:
      - Код запущен и работает, но TypeScript нашёл в нём несоответствие
      - Код не запущен — превью ждёт, пока ошибку исправят
      - Компонент упал во время рендера, и дерево компонентов убрано
      - Приложение работает только в продакшен-сборке, а не в разработке
    explanation: |
      Ошибки типов не останавливают приложение ни в превью, ни в Vite при разработке; не запускается код только с синтаксической ошибкой (метка «Сборка»). Но проверка типов при сборке настоящего проекта такой код не пропустит (шаг «Отладка»).
    step: 06-debugging

  - question: |
      Во что компилятор превращает тег `<GameCard />`?
    options:
      - В вызов `jsxDEV(GameCard, {…})` — тип элемента сама функция
      - В вызов `jsxDEV('GameCard', {…})` — тип элемента строка
      - В вызов `GameCard({})` прямо на месте тега
      - В вызов `document.createElement('GameCard')`
    explanation: |
      Каждый тег становится вызовом `jsxDEV(тип, props, …)`. Для тега HTML тип — строка (`'main'`), для компонента — сама функция. Поэтому важна большая буква: со строчной компилятор записал бы строку, то есть тег HTML (шаг «Под капотом: JSX»).
    step: 07-jsx

  - question: |
      Что такое React-элемент, который возвращает `<h1>Ход конём</h1>`?
    options:
      - Замороженный объект-описание с полями `type`, `props` и `key`
      - DOM-элемент `<h1>`, который React позже вставит в страницу
      - Объект, который React меняет на месте при каждом обновлении
      - Строка HTML, которую React запишет в `innerHTML` корня
    explanation: |
      `jsxDEV` возвращает не элемент страницы, а маленький объект-описание; `Object.isFrozen(element)` — `true`. Чтобы показать другое, компонент возвращает новый элемент, а React сверяет новое дерево с прошлым и меняет в DOM только то, что изменилось (шаг «Под капотом: JSX»).
    step: 07-jsx

  - question: |
      Почему компонент не может вернуть два соседних элемента без обёртки?

      ```tsx
      export function App() {
        return (
          <h1>Ход конём</h1>
          <p>Магазин настольных игр</p>
        );
      }
      ```
    options:
      - Каждый тег — вызов функции, а вернуть два вызова подряд в JS нельзя
      - Корень React вмещает только один DOM-элемент внутри `#root`
      - Строгий режим запрещает компонентам возвращать больше одного узла
      - React нарисует только первый элемент, а второй потеряется
    explanation: |
      JSX компилируется в вызовы `jsxDEV`, и такой `return` — попытка вернуть два выражения подряд, что в JavaScript недопустимо. Поэтому код не собирается: `JSX expressions must have one parent element.` (шаги «Первый компонент» и «Под капотом: JSX»).
    step: 07-jsx
