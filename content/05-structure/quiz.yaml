# Квиз главы «Структура состояния и поля ввода». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Что произойдёт, если покупатель начнёт печатать в таком поле?

      ```tsx
      const [query, setQuery] = useState('');
      …
      <input value={query} />
      ```
    options:
      - 'Поле не изменится, а React предупредит: у `value` нет `onChange` — нужен `onChange`, `readOnly` или `defaultValue`'
      - 'Текст появится в поле, но состояние `query` останется пустым, пока не добавить `onChange`'
      - 'Поле молча станет неуправляемым: React перестанет следить за `value` после первой буквы'
      - 'TypeScript не даст собрать код: у `<input>` с `value` обработчик `onChange` обязателен'
    explanation: |
      После каждого нажатия React возвращает в поле значение из состояния, а оно не меняется. В консоли: «You provided a `value` prop to a form field without an `onChange` handler. This will render a read-only field. …» (шаг «Управляемые поля»).
    step: 01-controlled

  - question: |
      Состояние поиска объявили так, а `query.trim()` переписали в `(query ?? '').trim()`. Что покажет консоль после первой буквы в поле?

      ```tsx
      const [query, setQuery] = useState<string>();
      …
      <input value={query} onChange={(e) => setQuery(e.target.value)} />
      ```
    options:
      - 'Предупреждение: компонент превращает неуправляемое поле в управляемое'
      - 'Ничего: `undefined` в `value` React считает пустой строкой'
      - 'Ошибку рендера: `value` не может быть `undefined`, приложение упадёт'
      - 'Предупреждение: у поля с `value` нет обработчика `onChange`'
    explanation: |
      `value={undefined}` для React значит «поле неуправляемое». После первой буквы `value` стал строкой, и React пишет «A component is changing an uncontrolled input to be controlled. …». У управляемого поля `value` — всегда строка, пустое — `''` (шаг «Управляемые поля»).
    step: 01-controlled

  - question: |
      Форма подписки отправлена со снятым флажком `<input type="checkbox" name="weekly" defaultChecked />`. Что вернёт `data.get('weekly')`?

      ```tsx
      const data = new FormData(e.currentTarget);
      ```
    options:
      - '`null` — неотмеченного флажка в `FormData` нет'
      - "Строку `'off'` — пару к `'on'` у отмеченного флажка"
      - '`false` — `FormData` хранит у флажков логические значения'
      - "Пустую строку `''` — как у пустого текстового поля"
    explanation: |
      В эксперименте `console.log([...data.entries()])` со снятым флажком печатает только `email` и `topic`. Отмеченный флажок без атрибута `value` даёт строку `'on'`, поэтому в коде сравнение `data.get('weekly') === 'on'` (шаг «Неуправляемые поля»).
    step: 02-uncontrolled

  - question: |
      Покупатель печатает адрес в неуправляемом поле формы подписки, меняет тему и щёлкает флажок. Сколько раз React вызовет `Footer` до нажатия «Подписаться»?
    options:
      - 'Ни разу: значения меняются в DOM, состояние не трогается'
      - 'По одному разу на каждую букву и каждое изменение поля'
      - 'Один раз — когда поле теряет фокус, как событие `change`'
      - 'Дважды на каждое изменение — из-за строгого режима'
    explanation: |
      С `console.log('render Footer')` в консоли пусто, пока форму не отправили. После отправки — две строки: `setResult` запустил рендер, строгий режим его удвоил (шаг «Неуправляемые поля»).
    step: 02-uncontrolled

  - question: |
      У поля `<input defaultValue={'v' + n} />` после первого рендера `n` изменилось с 1 на 2. Что видит пользователь в поле?
    options:
      - '«v1»: `defaultValue` задаёт только начальное значение'
      - '«v2»: React обновит поле, как при изменении `value`'
      - 'Пустое поле: React пересоздаст `<input>` с новым значением'
      - '«v1v2»: React допишет новое значение к введённому'
    explanation: |
      Значение по умолчанию React применяет один раз, при появлении поля. Атрибут `value` в DOM станет «v2», но текст в поле останется «v1». Чтобы поле показывало новые данные, нужно управляемое поле или сброс через `key` (шаг «Неуправляемые поля»).
    step: 02-uncontrolled

  - question: |
      Чем плохо хранить отфильтрованный список в состоянии и обновлять его в обработчике поиска?

      ```tsx
      const [shown, setShown] = useState(games);
      // в onChange поиска:
      setShown(games.filter((g) => g.title.includes(value)));
      ```
    options:
      - 'Список и фильтры — два источника истины: смена категории не обновит `shown`, и они разойдутся'
      - 'React запрещает хранить в состоянии массивы объектов — только примитивы'
      - '`setShown` внутри `onChange` вызывает бесконечный цикл рендеров'
      - 'Ничем, если сеттер вызывать функцией обновления: `setShown((s) => …)`'
    explanation: |
      В эксперименте после «ко» и выбора «Семейные» на экране остались «Космические коты»: обработчик категории ничего не знает про `shown`. Список — производное значение, его вычисляют при рендере из всех фильтров (шаг «Вычислять, а не хранить»).
    step: 03-derived

  - question: |
      Родитель нажатием кнопки меняет `n` с 1 на 2. Что нарисует `Child`?

      ```tsx
      function Child({ n }: { n: number }) {
        const [copy] = useState(n);
        return <p>{n}/{copy}</p>;
      }
      ```
    options:
      - '«2/1»: начальное значение состояния берётся только при первом рендере'
      - '«2/2»: React заново вызывает `useState(n)` и берёт новое значение'
      - '«1/1»: компонент с состоянием не обновляется от новых props'
      - '«2/1» и предупреждение React о копировании props в состояние'
    explanation: |
      Копия props в состоянии не обновляется: `useState(n)` использует `n` только при создании состояния. Держите props как есть и вычисляйте из них (шаг «Вычислять, а не хранить»).
    step: 03-derived

  - question: |
      `App` должен помнить, какая игра открыта, или что открыт каталог. Какое состояние лучше всего подходит?
    options:
      - '`selectedId: number | null` — `null` для каталога, игру находить по id при рендере'
      - '`selectedGame: Game | null` — так странице не нужно искать игру в каталоге'
      - '`isOpen: boolean` и `selectedId: number` — отдельно «открыто ли» и «что»'
      - '`selectedGame: Game` и `selectedQuantity: number` — всё, что показывает страница'
    explanation: |
      Одно поле не может противоречить само себе, а id не дублирует данные каталога. Копия устаревает: в эксперименте с `selectedQuantity` страница показала 0, а в корзине оказалось 4 «Ночных экспресса» при остатке 3 (шаг «Принципы структуры состояния»).
    step: 04-structure

  - question: |
      Без `key` на `<GameDetails game={selectedGame} />` покупатель начал отзыв об «Острове сокровищ» и нажал «Следующая игра →». Что в поле отзыва у «Драконьей почты» и почему?
    options:
      - 'Текст отзыва об «Острове»: тот же тип на том же месте — для React это тот же компонент с новыми props'
      - 'Пустое поле: новые props `game` всегда сбрасывают состояние компонента'
      - 'Пустое поле: React сравнивает props и пересоздаёт компонент, если они изменились'
      - 'Текст отзыва, но только до следующего рендера: потом React заметит смену `game`'
    explanation: |
      Состояние привязано к месту в дереве: пока на третьем месте `<main>` стоит `GameDetails`, его `useState` возвращает сохранённые значения. `key={selectedGame.id}` делает страницу каждой игры отдельным компонентом (шаг «Сохранение и сброс состояния»).
    step: 05-reset

  - question: |
      У компонента `Field` внутри своё состояние текста. Покупатель ввёл текст и переключил `isA`. В каком варианте текст **сохранится**?
    options:
      - '`{isA ? <Field label="A" /> : <Field label="B" />}`'
      - '`{isA && <Field label="A" />}{!isA && <Field label="B" />}`'
      - '`{isA ? <Field key="a" label="A" /> : <Field key="b" label="B" />}`'
      - '`{isA ? <Field label="A" /> : <div><Field label="B" /></div>}`'
    explanation: |
      В тернарном операторе оба поля на одном месте и одного типа — для React это один компонент, сменился только `label`. Два `&&` — два разных места, разные `key` — разные компоненты, обёртка `div` — другой тип на месте (шаг «Под капотом: позиция в дереве»).
    step: 08-position

  - question: |
      Акцию над страницей игры скрыли условием, когда корзина не пуста. Покупатель пишет отзыв на странице игры и нажимает «В корзину». Что будет с отзывом?

      ```tsx
      <main>
        {cartCount === 0 && <p className={styles.promo} … />}
        <MiniCart … />
        <GameDetails key={selectedGame.id} … />
      </main>
      ```
    options:
      - 'Останется: `false` от `&&` держит своё место, `GameDetails` по-прежнему на месте 2'
      - 'Пропадёт: акция исчезла, `GameDetails` сдвинулся на место 1 и создан заново'
      - 'Пропадёт: изменение `cartCount` в `App` пересоздаёт всех детей `<main>`'
      - 'Останется, но только потому, что у `GameDetails` есть `key`'
    explanation: |
      `false`, `null` и `undefined` не попадают в DOM, но место среди детей за ними сохраняется. Датчик `whereIs` показал `место 2` и до, и после щелчка, строки «новое состояние» не было (шаг «Под капотом: позиция в дереве»).
    step: 08-position

  - question: |
      Что выведет консоль после одного щелчка «В корзину» (строгий режим включён)?

      ```tsx
      function cartReducer(items: CartItem[], action: CartAction) {
        console.log('reducer');
        …
      }
      function handleAdd(gameId: number) {
        dispatch({ type: 'added', gameId });
        console.log('после dispatch');
      }
      ```
    options:
      - '«после dispatch», затем «reducer» дважды'
      - '«reducer», затем «после dispatch»'
      - '«reducer» дважды, затем «после dispatch»'
      - '«после dispatch», затем «reducer» один раз'
    explanation: |
      `dispatch` только ставит действие в очередь, как сеттер `useState`; редьюсер вызывается во время рендера, а строгий режим вызывает его дважды с одним состоянием. Поэтому редьюсер обязан быть чистой функцией (шаг «useReducer»).
    step: 06-reducer

  - question: |
      Что выведет второй `console.log`?

      ```ts
      const base = [
        { gameId: 1, quantity: 1 },
        { gameId: 2, quantity: 1 },
      ];
      const next = produce(base, (draft) => {
        draft[0].quantity += 1;
      });
      console.log(base[0].quantity, next[0].quantity);
      console.log(next === base, next[0] === base[0], next[1] === base[1]);
      ```
    options:
      - '`false false true` — новые только массив и изменённая позиция'
      - '`true true true` — Immer изменил `base` на месте'
      - '`false false false` — Immer глубоко копирует весь массив'
      - '`false true true` — новый только массив, объекты прежние'
    explanation: |
      Immer копирует путь от корня до изменения, а нетронутое переиспользует — структурное разделение. Первый `console.log` выводит `1 2`: исходник цел (шаг «Immer»).
    step: 07-immer

  - question: |
      Корзина на `useImmerReducer`. В обработчике перед `dispatch` написали `cart[0].quantity = 99`. Что произойдёт при щелчке, когда в корзине уже есть позиция?
    options:
      - '`TypeError`: состояние заморожено — менять можно только черновик внутри редьюсера'
      - 'Количество станет 99: с Immer состояние можно менять где угодно'
      - 'Количество станет 99, но экран обновится только после следующего `dispatch`'
      - 'TypeScript не соберёт код: у состояния Immer тип `readonly`'
    explanation: |
      TypeScript молчит, а в консоли `TypeError: Cannot assign to read only property 'quantity' of object '#<Object>'`, и корзина не меняется: Immer замораживает результат. «Мутировать можно» относится только к черновику (шаг «Immer»).
    step: 07-immer
