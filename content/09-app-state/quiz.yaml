# Квиз главы «Состояние приложения». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Корзина переехала из контекста в стор с селекторами. Покупатель нажал «В корзину» у «Острова сокровищ» — он есть в «Хитах» и во «Всех играх». Сколько строк `render GameCard` напечатает лог (со строгим режимом)?

      ```tsx
      const quantity = useCartStore((state) =>
        quantityInCart(state.items, game.id),
      );
      ```
    options:
      - 4 — рендерятся только две карточки «Острова», по два вызова
      - 12 — рендерятся все шесть карточек, как с контекстом
      - 2 — рендерится только карточка, на которой нажали кнопку
      - 0 — карточки читают стор, а не состояние React
    explanation: |
      Каждая карточка выбирает количество своей игры. Изменилось оно только у «Острова», а он нарисован дважды; строгий режим удваивает вызовы (шаг «Свой стор»).
    step: 01-own-store

  - question: |
      В сторе гаснет уведомление: `setState({ toast: null })`. Почему шапка, которая выбирает `state.items.reduce(…)`, не рендерится?
    options:
      - Новый объект состояния содержит тот же массив `items`, и селектор вернул то же число
      - Стор не зовёт подписчиков, если изменилось только уведомление
      - React пропускает рендер, пока не завершился таймер уведомления
      - Шапка подписана на стор только при первом рендере
    explanation: |
      Стор зовёт всех подписчиков, React вызывает селектор каждого и сравнивает результат через `Object.is`. Число штук не изменилось — рендера нет (шаг «Свой стор»).
    step: 01-own-store

  - question: |
      Что произойдёт с таким селектором?

      ```tsx
      const { items } = useCartStore((state) => ({
        items: state.items,
      }));
      ```
    options:
      - 'Бесконечный цикл: «The result of getSnapshot should be cached…» и «Maximum update depth exceeded»'
      - 'Работает, но компонент рендерится при каждом изменении стора'
      - 'Работает как `(state) => state.items`: React сравнит объекты по полям'
      - 'Ошибка TypeScript: селектор должен вернуть массив'
    explanation: |
      Селектор каждый раз возвращает новый объект, `Object.is` всегда видит изменение, и React рендерит снова и снова (шаги «Свой стор» и «Zustand»).
    step: 01-own-store

  - question: |
      Мини-корзине нужны четыре действия стора одним вызовом хука. Как написать без бесконечного цикла?
    options:
      - 'Обернуть селектор, который возвращает объект, в `useShallow`'
      - 'Передать вторым аргументом хука функцию `shallow`'
      - 'Обернуть селектор в `useMemo` с пустыми зависимостями'
      - 'Вызвать `useCartStore()` без селектора и взять действия из результата'
    explanation: |
      `useShallow` сравнивает результат с прошлым по полям и возвращает прошлый объект, если поля те же. Второго аргумента у хука в Zustand 5 нет — он остался в `zustand/traditional` (шаг «Zustand»).
    step: 02-zustand

  - question: |
      `const { items } = useCartStore();` — чем плох вызов без селектора?
    options:
      - Хук возвращает всё состояние, и компонент рендерится от любого изменения — даже когда гаснет уведомление
      - Без селектора хук возвращает начальное состояние и не обновляется
      - Без селектора Zustand бросает ошибку в режиме разработки
      - Ничем — Zustand сам находит, какие поля прочитал компонент
    explanation: |
      Без селектора снимок — весь `state` (`identity`), а он новый при каждом `set`. Опыт в шаге «Zustand»: уведомление погасло — `render MiniCart ×2`.
    step: 02-zustand

  - question: |
      Как вызвать действие корзины из обычного модуля — например, из таймера в `main.tsx`?
    options:
      - '`useCartStore.getState().add(4)` — у хука есть методы стора'
      - 'Только из компонента: действие — хук, его нельзя вызывать снаружи'
      - '`useCartStore((state) => state.add)(4)` прямо в модуле'
      - 'Через контекст: обернуть `main.tsx` в провайдер стора'
    explanation: |
      `create` копирует в хук методы стора (`getState`, `setState`, `subscribe`), поэтому стор работает и без React (шаги «Zustand» и «Под капотом»).
    step: 02-zustand

  - question: |
      `persist({ name: 'cart' })` сохранил и позиции, и текст уведомления. После перезапуска «Добавлено: Остров сокровищ» висит и не гаснет. Добавили `partialize: (state) => ({ items: state.items })` — а уведомление после ⟳ всё ещё висит. Почему?
    options:
      - В хранилище старая запись с уведомлением — её прочитали; нужны `version` и `migrate`
      - '`partialize` работает только вместе с `createJSONStorage`'
      - '`partialize` влияет только на чтение, а не на запись'
      - Уведомление восстанавливает таймер, а не `persist`
    explanation: |
      `partialize` решает, что записывать. Прочитали то, что записала прошлая версия кода. Подняв `version`, мы заставим `persist` вызвать `migrate` и перезаписать данные в новом формате (шаг «Сохранение»).
    step: 03-persist

  - question: |
      В сторе `version: 2`, а в `localStorage` — запись версии 1. Функции `migrate` нет. Что будет?
    options:
      - "Ошибка в консоли «…couldn't be migrated since no migrate function was provided» и пустая корзина"
      - 'Запись версии 1 прочитается как есть, версия обновится до 2'
      - 'Приложение упадёт с ошибкой при создании стора'
      - 'Запись удалится, и в консоли ничего не будет'
    explanation: |
      `persist` не знает, как читать старый формат, и начинает с начального состояния; запись в хранилище при этом не трогает (шаг «Сохранение»).
    step: 03-persist

  - question: |
      Где посчитать итоги мини-корзины (позиции с играми, сумму, скидку)?
    options:
      - 'При рендере: выбрать из стора `items` и вызвать `summarizeCart(items, games)`'
      - 'В селекторе: `useCartStore((state) => summarizeCart(state.items, games))`'
      - 'В селекторе с `useShallow` — он сравнит итоги по полям'
      - 'В сторе: хранить `total` рядом с `items` и обновлять в каждом действии'
    explanation: |
      `summarizeCart` возвращает новый объект с новым массивом `lines` — в селекторе это бесконечный цикл, и `useShallow` не спасает: поле `lines` всегда новое. Хранить итог — дублировать данные (шаг «Производное состояние»).
    step: 04-derived

  - question: |
      Срез корзины в `add` показывает уведомление из соседнего среза. Как?
    options:
      - '`get().showToast(…)` — `get` возвращает состояние всего стора'
      - '`useCartStore((state) => state.showToast)` внутри среза'
      - 'Импортировать `createToastSlice` и вызвать его'
      - 'Срезы не видят друг друга — нужен второй стор'
    explanation: |
      Каждый срез получает те же `set` и `get`, что и весь стор, а `StateCreator<CartState, …>` типизирует их всем состоянием (шаг «Срезы и devtools»).
    step: 05-slices

  - question: |
      Почему `devtools` ставят снаружи: `devtools(persist(…))`?
    options:
      - '`devtools` подменяет `set`; если внутри другой middleware тоже меняет `set`, имя действия может потеряться'
      - '`persist` не работает, если его обернуть в другой middleware'
      - 'Иначе `persist` сохранит в `localStorage` и журнал действий'
      - 'Порядок не важен — так просто принято в документации'
    explanation: |
      Так советует документация Zustand: последним (снаружи) — `devtools`, чтобы до него никто не менял `set` и третий аргумент — имя действия — дошёл до журнала (шаг «Срезы и devtools»).
    step: 05-slices

  - question: |
      Когда Jotai пересчитает производный атом?

      ```tsx
      const filtersAtom = atom((get) => ({
        query: get(queryAtom),
        category: get(categoryAtom),
      }));
      ```
    options:
      - Когда изменился `queryAtom` или `categoryAtom` — зависимости найдены по вызовам `get`
      - При каждом рендере компонента, который его читает
      - При каждом изменении любого атома в сторе Jotai
      - Только один раз — производные атомы не меняются
    explanation: |
      Опыт в шаге «Атомы»: буква в поиске — один пересчёт, открытие страницы игры рендерит `App`, но атом не пересчитывается. Объект новый только после изменения зависимостей.
    step: 06-atoms

  - question: |
      Чем `useSetAtom(resetFiltersAtom)` отличается от `useAtom(resetFiltersAtom)`?
    options:
      - Возвращает только функцию записи, и компонент не рендерится при изменении значения атома
      - Ничем — это короткая запись того же хука
      - '`useSetAtom` сбрасывает атом к начальному значению'
      - '`useSetAtom` работает только с атомами без значения'
    explanation: |
      `useAtomValue` — только значение, `useSetAtom` — только запись, без подписки на значение (шаг «Атомы»).
    step: 06-atoms

  - question: |
      Компонент подписан на стор «по-старому»: копия в `useState`, подписка в `useEffect`. Стор изменился в layout-эффекте сразу после первой фиксации. Что на экране?
    options:
      - Старое значение — изменение случилось до подписки, и о нём некому было сообщить
      - Новое значение — `useEffect` при подписке перечитывает стор сам
      - Ошибка React о том, что стор изменился во время рендера
      - Новое значение после второго рендера в строгом режиме
    explanation: |
      Опыт в шаге «Под капотом»: «Эффект: 0» и «useSyncExternalStore: 1». `useSyncExternalStore` после фиксации сверяет снимок ещё раз и рендерит заново.
    step: 07-under-the-hood

  - question: |
      Куда по карте решений положить номер страницы каталога, если ссылкой на неё делятся в мессенджере?
    options:
      - В адрес страницы — `?page=2`
      - В стор Zustand с `persist`
      - В контекст рядом с темой
      - В `useState` компонента каталога
    explanation: |
      То, что должно пережить перезагрузку и пересылаться ссылкой, — часть адреса (шаг «Карта решений», глава 10).
    step: 08-decision-map
