# Квиз главы «Роутинг». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В режиме данных React Router 8 откуда импортировать `RouterProvider`, а откуда — `createBrowserRouter`?
    options:
      - '`RouterProvider` — из `react-router/dom`, `createBrowserRouter` — из `react-router`'
      - 'Оба — из `react-router-dom`'
      - '`RouterProvider` — из `react-router`, `createBrowserRouter` — из `react-router/dom`'
      - 'Оба — из `react-router/dom`'
    explanation: |
      Так велит документация режима данных: `RouterProvider` из `react-router/dom` получает `flushSync` из `react-dom`. Пакета `react-router-dom` в v8 нет (шаг «Маршруты»).
    step: 01-routes

  - question: |
      Из маршрутов удалили `{ path: '*', Component: NotFoundPage }` и открыли `/nope`. Что на экране?
    options:
      - 'Встроенная страница роутера «Unexpected Application Error!» и 404 — без шапки магазина'
      - 'Шапка и подвал магазина, а между ними пусто'
      - 'Главная страница: роутер берёт индексный маршрут'
      - 'Пустой экран и ошибка в консоли'
    explanation: |
      Ни один маршрут не подошёл — даже корневой, поэтому нет и макета (шаг «Маршруты»).
    step: 01-routes

  - question: |
      Сводка корзины в шапке — `<NavLink to="/cart" className={styles.cart}>`. Как выделить её, когда открыта корзина, если стили — CSS Modules?
    options:
      - "Стилем по атрибуту: `.cart[aria-current='page']` — NavLink ставит его активной ссылке"
      - 'Классом `.active` в `Header.module.css` — NavLink добавит его сам'
      - 'Через `useLocation` и сравнение `pathname` в каждом рендере'
      - 'NavLink в CSS Modules не поддерживается — нужен обычный Link'
    explanation: |
      Класс `active` NavLink добавляет глобальным, а имена CSS Modules превращаются в `Header_cart_…`. Атрибут `aria-current="page"` и для стиля удобен, и для программы чтения с экрана (шаг «Ссылки»).
    step: 02-links

  - question: |
      Ссылку на корзину сделали обычной `<a href="/cart">`. Что изменится при щелчке?
    options:
      - 'Приложение загрузится заново: состояние в памяти (текст в поле подписки) пропадёт'
      - 'Ничего: роутер перехватывает все ссылки на свои адреса'
      - 'Ссылка не сработает — нужен `to`, а не `href`'
      - 'Корзина откроется в новой вкладке'
    explanation: |
      `<a href>` — обычная загрузка страницы. `Link` рисует такой же `<a>`, но перехватывает щелчок и меняет адрес через History API (шаг «Ссылки»).
    step: 02-links

  - question: |
      Маршрут `games/:id`. Почему так сравнение не работает?

      ```tsx
      const { id } = useParams();
      const game = games.find((game) => game.id === id);
      ```
    options:
      - "Параметры адреса — строки: `4 === '4'` ложно, и TypeScript предупреждает об этом (TS2367)"
      - '`useParams` возвращает параметры только после загрузки `loader`'
      - 'Параметр называется `params.id`, а не `id`'
      - 'Сравнение работает: React Router сам приводит `:id` к числу'
    explanation: |
      `id` — `string | undefined`, а `game.id` — число. Сравниваем со `String(game.id)` (шаг «Параметры»).
    step: 03-params

  - question: |
      Со страницы `/games/1` нажали ссылку «Следующая игра →» на `/games/2`. Если у `GameDetails` нет `key`, что будет с сообщением «Спасибо!» об отправленном отзыве?
    options:
      - 'Останется: маршрут тот же, компонент на том же месте — React сохранил его состояние'
      - 'Пропадёт: при смене адреса роутер пересоздаёт компоненты страницы'
      - 'Пропадёт: `useParams` сбрасывает состояние компонента'
      - 'React выдаст предупреждение о недостающем `key`'
    explanation: |
      Сменились только props, состояние `GameDetails` осталось — урок главы 5. `key={game.id}` даёт каждой игре свой компонент (шаг «Параметры»).
    step: 03-params

  - question: |
      Поиск каталога пишет в адрес: `setSearchParams(filtersToParams(next))`. Покупатель набрал «ост». Что будет при нажатии «назад»?
    options:
      - 'Сотрётся одна буква: каждая буква добавила запись в историю — нужен `replace: true`'
      - 'Покупатель вернётся на страницу до каталога'
      - 'Ничего: `setSearchParams` не трогает историю'
      - 'Сбросятся все фильтры сразу'
    explanation: |
      Каждый вызов `setSearchParams` — переход и новая запись истории. Для поиска — `replace`, для категории и порядка — обычная запись (шаг «Состояние в URL»).
    step: 04-search-params

  - question: |
      Кабинет: `<NavLink to="." end>Избранное</NavLink>` и `<NavLink to="settings">Настройки</NavLink>` внутри маршрута `account`. Что делает `end`?
    options:
      - '«Избранное» активна только на `/account`, а не на `/account/settings`'
      - 'Ссылка ведёт в конец списка вкладок'
      - 'Делает путь абсолютным: `/account` вместо относительного'
      - 'Запрещает переход, пока не загружены данные'
    explanation: |
      Без `end` NavLink активен и на вложенных адресах — выделены были бы обе вкладки. `"settings"` без слеша считается от маршрута ссылки — `/account/settings` (шаг «Вложенные маршруты»).
    step: 05-nested

  - question: |
      У страницы игры есть `loader`. Покупатель на главной щёлкнул «Остров сокровищ», ответ сервера идёт секунду. Что он видит эту секунду?
    options:
      - 'Главную и адрес `/` — новая страница и адрес появятся после ответа'
      - 'Страницу игры с пустыми полями и адрес `/games/1`'
      - 'Компонент `HydrateFallback` вместо всего магазина'
      - 'Пустую страницу между шапкой и подвалом'
    explanation: |
      Загрузчик выполняется до рендера; пока он идёт, на экране старая страница, а `useNavigation().state === ''loading''`. `HydrateFallback` — только для первого захода (шаг «Загрузка данных»).
    step: 06-loaders

  - question: |
      Что делает `action` маршрута оформления, когда заказ принят?
    options:
      - "`return redirect('/checkout/done?order=1')` — роутер сразу откроет страницу «Заказ оформлен»"
      - 'Возвращает заказ, а страница сама вызывает `navigate` в `useEffect`'
      - 'Вызывает `useNavigate` внутри `action`'
      - 'Перезагружает страницу, чтобы очистить форму'
    explanation: |
      `action` — функция вне React, хуков в ней нет. Ошибку она возвращает данными (`useActionData`), успех — ответом-переходом `redirect` (шаг «Изменение данных»).
    step: 07-actions

  - question: |
      Подписку в подвале отправляют через `fetcher.Form` на ресурсный маршрут `/subscribe`. Чем это отличается от обычной `<Form>`?
    options:
      - 'Адрес и история не меняются, а состояние и ответ — свои у фетчера (`fetcher.state`, `fetcher.data`)'
      - 'Фетчер не вызывает `action` — он отправляет запрос на сервер напрямую'
      - 'После фетчера роутер не перезагружает данные страницы'
      - 'Фетчер работает только с методом GET'
    explanation: |
      `Form` — переход (с обычной формой адрес стал бы `/subscribe`), фетчер — действие на месте. После `action` фетчера загрузчики страницы **перезагружаются** — в «Сети» видно `GET /api/games/4` (шаг «useFetcher»).
    step: 08-fetchers

  - question: |
      `ErrorBoundary: RouteError` стоит только у корневого маршрута с макетом. Загрузчик игры бросил `data(null, { status: 404 })`. Что на экране?
    options:
      - '«Такой страницы нет» без шапки и подвала — граница корня заменила весь макет'
      - '«Такой страницы нет» внутри макета, шапка на месте'
      - 'Страница игры с пустыми данными'
      - 'Встроенная страница роутера «Unexpected Application Error!»'
    explanation: |
      Граница маршрута заменяет его компонент. Чтобы шапка осталась, страницы оборачивают в маршрут без `path` со своей границей (шаг «Ошибки и 404»).
    step: 09-errors

  - question: |
      Маршрут оформления сделали ленивым: `lazy: async () => { … await import('./checkout/CheckoutPage') … }`. Когда выполнится модуль `CheckoutPage.tsx`?
    options:
      - 'При первом переходе на `/checkout`, и только один раз'
      - 'При запуске приложения, но страница нарисуется позже'
      - 'При каждом переходе на `/checkout`'
      - 'Никогда: в превью курса `lazy` не работает'
    explanation: |
      Лог в начале модуля появляется при первом переходе и больше не повторяется. При этом в `routes.tsx` не должно остаться статического импорта модуля (шаг «Ленивые маршруты»).
    step: 10-lazy

  - question: |
      Чем защита оформления в `loader` (`redirect('/cart')` при пустой корзине) лучше «гарда» `<Navigate to="/cart" />` в компоненте?
    options:
      - 'Страница не рендерится вовсе: решение принимается до компонента и его хуков'
      - 'Только `loader` не даёт отправить пустой заказ на сервер'
      - 'С `loader` код страницы не загружается при перенаправлении'
      - '`Navigate` в React 19 запрещён'
    explanation: |
      С `<Navigate>` в консоли видно два `render CheckoutPage 0` до перехода. Код ленивой страницы грузится и при `redirect` — роутер запускает `lazy` параллельно с `loader`. А безопасность — на сервере (шаг «Защита маршрутов»).
    step: 11-guards

  - question: |
      Маршруты в таком порядке: `/games/:id`, `/games/new`, `*`. Какой выберет роутер для адреса `/games/new`?
    options:
      - '`/games/new` — у статического сегмента больше очков, порядок решает только ничью'
      - '`/games/:id` — он раньше в массиве'
      - '`*` — он подходит к любому адресу'
      - 'Оба первых: роутер нарисует их друг за другом'
    explanation: |
      React Router ранжирует пути: статический сегмент — 10 очков, параметр — 3, `*` — штраф (шаг «Под капотом»).
    step: 13-under-the-hood
