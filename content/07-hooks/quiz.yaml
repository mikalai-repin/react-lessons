# Квиз главы «Собственные хуки». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Как React понимает, какое значение вернуть каждому из двух `useState` компонента при следующем рендере?
    options:
      - По порядку вызова — у компонента список ячеек, хуки получают их по очереди
      - По имени переменной слева от `=` — компилятор JSX сохраняет его в вызове
      - По начальному значению — у `useState('')` и `useState(false)` разные ячейки
      - По строке исходного кода — React запоминает место вызова через стек
    explanation: |
      Хуки не передают React никаких имён. При первом рендере React создаёт ячейки по одной на вызов, при следующих — раздаёт их по тому же порядку (шаг «Правила хуков»).
    step: 01-rules

  - question: |
      В `GameDetails` после всех хуков добавили код ниже. Покупатель открыл «Остров сокровищ» и нажал «В корзину». Что произойдёт?

      ```tsx
      if (quantity > 0) {
        useEffect(() => {
          console.log('в корзине', quantity);
        });
      }
      ```
    options:
      - 'Ошибка «Rendered more hooks than during the previous render.», страница пропадёт'
      - 'В консоли «в корзине 1», а линтер и React промолчат — хук стоит в конце'
      - 'Ошибка типов TypeScript: хук нельзя вызывать в блоке `if`'
      - 'Эффект просто не выполнится, пока `quantity` равен 0, — ошибок не будет'
    explanation: |
      В прошлом рендере было четыре ячейки, теперь компонент попросил пятую. React печатает таблицу порядка хуков и бросает «Rendered more hooks than during the previous render.»; TypeScript при этом молчит (шаг «Правила хуков»).
    step: 01-rules

  - question: |
      Как линтер `eslint-plugin-react-hooks` отличает компоненты и хуки от обычных функций, чтобы проверять правила хуков?
    options:
      - 'По имени: с большой буквы — компонент, с `use` — хук'
      - 'По типу результата: компонент возвращает JSX, хук — всё остальное'
      - 'По импортам: функция, которая импортирует что-то из `react`, — компонент или хук'
      - 'По запуску: линтер выполняет код и смотрит, вызывает ли его React'
    explanation: |
      Сообщение правила `rules-of-hooks` прямо об этом: «React component names must start with an uppercase letter. React Hook names must start with the word "use"». Поэтому `readDraft` с `useState` внутри — ошибка, хотя React бы её выполнил (шаг «Линтер»).
    step: 02-linter

  - question: |
      Какое из нарушений главы 3 линтер с набором `recommended` **не** отмечает?
    options:
      - "`game.tags.push('хит')` — изменение массива из props"
      - '`props.game = { …props.game, price: 0 }` — присваивание в props'
      - '`rendered += 1` для переменной модуля при рендере'
      - '`function Header()` внутри `App`, использованный в JSX `App`'
    explanation: |
      Правила компилятора ловят присваивание `props.game =`, `rendered += 1` и компонент, созданный при рендере, но `game.tags.push(…)` и `rendered++` пропускают. Линтер не отменяет понимания правил (шаг «Линтер»).
    step: 02-linter

  - question: |
      `App` и `GameDetails` вызывают `useLocalStorage('review-draft:1', '')`. Покупатель пишет отзыв на странице «Острова», потом нажимает «В корзину». Что увидит `App` в своём `draft`?
    options:
      - 'Пустую строку — у каждого вызова хука своё состояние, а хранилище не сообщает React о записи'
      - 'Текст отзыва — у двух вызовов с одним ключом одна ячейка состояния'
      - 'Текст отзыва — `App` перечитывает `localStorage` при каждом рендере'
      - 'Ошибку — два компонента не могут вызывать хук с одним ключом'
    explanation: |
      Свой хук делит код, а не состояние: каждый вызов — свой `useState` в том компоненте, который хук вызвал. Начальное значение читается один раз, при создании состояния, а подписки на хранилище нет (шаг «Первый свой хук»).
    step: 03-local-storage

  - question: |
      Зачем `useLocalStorage` возвращает `[value, setStoredValue] as const`?
    options:
      - 'Чтобы TypeScript вывел кортеж «значение, затем функция», а не массив, где каждый элемент «то ли значение, то ли функция»'
      - 'Чтобы React не создавал новый массив при каждом рендере и не рендерил компонент лишний раз'
      - 'Чтобы массив был заморожен и вызывающий не мог подменить функцию записи'
      - 'Чтобы деструктуризация `const [review, setReview]` работала — без него она недоступна'
    explanation: |
      Без `as const` тип результата — `(string | ((next: string) => void))[]`, и `setReview('')` даёт TS2349 «This expression is not callable». `as const` влияет только на типы (шаг «Первый свой хук»).
    step: 03-local-storage

  - question: |
      Покупатель быстро набрал в поиске «ост». Что выведут логи в эффекте `useDebouncedValue`?

      ```tsx
      useEffect(() => {
        console.log('таймер:', value);
        const id = setTimeout(() => setDebounced(value), delay);
        return () => {
          console.log('отмена:', value);
          clearTimeout(id);
        };
      }, [value, delay]);
      ```
    options:
      - '`отмена: `, `таймер: о`, `отмена: о`, `таймер: ос`, `отмена: ос`, `таймер: ост`'
      - '`таймер: о`, `таймер: ос`, `таймер: ост`, затем три строки `отмена:` после паузы'
      - '`таймер: ост` — эффект ждёт паузу в наборе и запускается один раз'
      - '`таймер: о`, `отмена: о` и больше ничего — таймер не перезапускается, пока не сработал'
    explanation: |
      Каждая буква меняет `value`: React вызывает очистку прошлого эффекта (её таймер отменён) и запускает новый. До `setDebounced` доживает только таймер последней буквы (шаг «Хуки поверх эффектов»).
    step: 04-effect-hooks

  - question: |
      Из `useDebouncedValue` убрали очистку: в эффекте осталось `setTimeout(() => setDebounced(value), delay)`. Покупатель быстро набрал «ост». Что будет?
    options:
      - 'Через 0,3 с значение с задержкой станет «о», «ос», «ост» по очереди — витрина перестроится трижды'
      - 'Ничего не изменится — задержка по-прежнему сработает один раз, после последней буквы'
      - 'Значение с задержкой никогда не изменится — без очистки таймер не запускается'
      - 'React выдаст предупреждение об эффекте без очистки и выполнит её сам'
    explanation: |
      Без `clearTimeout` срабатывают все три таймера: эффект-датчик печатает `ищем: о`, `ищем: ос`, `ищем: ост`. Задержка превратилась в «то же самое, только позже» (шаг «Хуки поверх эффектов»).
    step: 04-effect-hooks

  - question: |
      `useOnlineStatus()` вызывают и `OfflineBanner`, и шапка. Сеть пропала. Что покажут компоненты?
    options:
      - 'Оба сразу покажут «нет сети» — значение живёт в браузере, и каждый вызов на него подписан'
      - 'Только тот, кто вызвал хук первым, — второй вызов получает копию состояния'
      - 'Оба — но шапка на секунду позже: подписки обрабатываются по очереди'
      - 'Ни один, пока компоненты не отрендерятся по другой причине'
    explanation: |
      Хук не делит состояние, но здесь его и нет: `useSyncExternalStore` читает `navigator.onLine`, а каждый вызов подписан на события `online`/`offline`. Полоса и «Офлайн: 0» в шапке появились одновременно (шаг «Хуки поверх эффектов»).
    step: 04-effect-hooks

  - question: |
      `LoadMore` передаёт в `useInView(ref, onLoad)` функцию `onLoad`, новую при каждом рендере `App`. Почему наблюдатель не пересоздаётся при каждом «В корзину»?
    options:
      - 'Хук читает `onEnter` через `useEffectEvent`, и функции нет в зависимостях эффекта'
      - 'React сравнивает функции по исходному коду, а он у `onLoad` не меняется'
      - '`IntersectionObserver` сам игнорирует повторное наблюдение за тем же элементом'
      - 'Эффект с `[ref]` выполняется один раз за всю жизнь приложения'
    explanation: |
      Хук принимает любую функцию и сам заботится, чтобы наблюдатель не пересоздавался. С `onEnter` в зависимостях каждое «В корзину» давало `наблюдение: стоп`, `наблюдение: старт` (шаг «API хука»).
    step: 05-hook-api

  - question: |
      В `GameDetails` есть эффект-датчик с зависимостью от функции из `useLocalStorage`. Что он напечатает, пока покупатель вводит в отзыв «Да», если функция записи в хуке объявлена как `function setStoredValue(…)` без `useCallback`?

      ```tsx
      useEffect(() => {
        console.log('эффект: новая setReview');
      }, [setReview]);
      ```
    options:
      - 'По строке на каждую букву — функция новая при каждом рендере, эффект перезапускается'
      - 'Ничего — функция записи стабильна, как сеттер `useState`'
      - 'Одну строку после паузы — эффекты с функциями React откладывает'
      - 'Ошибку — функцию нельзя класть в массив зависимостей'
    explanation: |
      Тело хука выполняется при каждом рендере, и объявленная в нём функция каждый раз новая. С `useCallback(…, [key])` датчик молчит до смены ключа (шаг «API хука»).
    step: 05-hook-api

  - question: |
      Эффект в компоненте вызывает `setReview` из `useLocalStorage` и `setSent` из `useState`, а массив зависимостей пуст. Что скажет `react-hooks/exhaustive-deps`?
    options:
      - 'Потребует `setReview`, а про `setSent` промолчит'
      - 'Потребует обе функции — линтер не различает их происхождение'
      - 'Промолчит про обе — функции в зависимости не кладут'
      - 'Потребует `setSent`, а про `setReview` промолчит'
    explanation: |
      О сеттерах `useState` линтер знает, что они стабильны. О функциях вашего хука — не знает: «React Hook useEffect has a missing dependency: 'setReview'» (шаг «API хука»).
    step: 05-hook-api

  - question: |
      Какой из этих хуков стоит заменить обычной функцией или встроенным хуком?
    options:
      - '`useFormatPrice(price)` — внутри только `Intl.NumberFormat`, ни одного хука'
      - '`useDebouncedValue(value, delay)` — состояние и эффект с таймером'
      - '`useOnlineStatus()` — подписка на события браузера через `useSyncExternalStore`'
      - '`useInView(ref, onEnter)` — наблюдатель с очисткой и `useEffectEvent`'
    explanation: |
      Приставка `use` — только у функций, которые вызывают хуки. Иначе она навязывает правила хуков без причины: `games.filter((g) => useIsHit(g))` — ошибка «cannot be called inside a callback» (шаг «Когда хук не нужен»).
    step: 06-no-hook

  - question: |
      В списке ячеек файбера `GameDetails` первыми идут `useState` и `useCallback`, хотя компонент вызывает `useLocalStorage`. Почему?
    options:
      - 'Свой хук для React не существует: это функция, чьи хуки занимают ячейки вызвавшего компонента'
      - 'React заменяет свои хуки встроенными при сборке, как JSX — на `jsxDEV`'
      - 'Ячейка `useLocalStorage` есть, но в режиме разработки React её скрывает'
      - 'Свои хуки хранятся в отдельном списке файбера, а здесь показаны только встроенные'
    explanation: |
      `useLocalStorage` вызывает `useState` и `useCallback` во время рендера `GameDetails` — они стоят в его списке так, будто написаны прямо в компоненте. Так же `useImmerReducer` в списке `App` — это `useMemo` и `useReducer` (шаг «Под капотом: где живут хуки»).
    step: 07-under-the-hood

  - question: |
      `useCountdown(SALE_ENDS)` вызвали прямо в `App`, а не в маленьком `PromoBanner`. Что изменится?
    options:
      - 'Каждый тик будет рендерить `App` со всеми карточками — состояние хука живёт в вызвавшем компоненте'
      - 'Ничего — хук рендерит только разметку, где используется его результат'
      - 'Таймер пойдёт медленнее — `App` рендерится дольше маленького компонента'
      - 'React выдаст предупреждение: хуки с таймерами нельзя вызывать в корневом компоненте'
    explanation: |
      В баннере за три секунды — ни одного рендера `GameCard`, в `App` — 36, по 12 в секунду (шесть карточек, по два вызова в строгом режиме). Часто меняющееся состояние держат пониже в дереве (практикум).
    step: 08-practice
